<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12345e">
<title>Gestión de Arriendos | Grupo Terracop</title>
<style>
:root{--navy:#12345e;--navy2:#1d4a80;--blue:#2b8fd9;--sky:#5bb8f0;--sky2:#9fd6f7;--pale:#e6f4fd;--pale2:#f3faff;--ink:#1b2a3a;--muted:#5f7286;--line:#d7e8f5;--bg:#eef7fd;
--red:#d32f2f;--redbg:#fdecec;--amber:#9a6200;--amberbg:#fff6e0;--orange:#c25400;--orangebg:#fff1e6;--green:#2e7d32;--greenbg:#e9f7ec;
--sh:0 2px 10px rgba(30,100,170,.08);--sh2:0 8px 24px rgba(30,100,170,.16)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dff1fc 0,#eef7fd 260px,#f5fbff 100%) fixed}
a{color:var(--navy2)}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(30,100,170,.10)}
header:after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--sky))}
.hw{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:40px}
.ht{flex:1;min-width:180px}.ht h1{margin:0;font-size:17px;color:var(--navy);letter-spacing:.2px}.ht .sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;background:var(--pale);padding:4px;border-radius:12px}
nav a{color:var(--navy);text-decoration:none;font-weight:600;padding:7px 10px;border-radius:9px;font-size:13px;transition:background .18s,color .18s,transform .18s}
nav a:hover{background:#fff;transform:translateY(-1px)}
nav a.on{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;box-shadow:0 3px 10px rgba(43,143,217,.35)}
nav a .cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:18px 16px 90px}
#view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn{font:inherit;border:1px solid var(--sky2);background:#fff;color:var(--navy2);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;transition:all .18s}
button:hover{background:var(--pale);border-color:var(--blue);transform:translateY(-1px)}
button.pri{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(43,143,217,.30)}
button.pri:hover{box-shadow:0 6px 16px rgba(43,143,217,.40);filter:brightness(1.06)}
button.sm{padding:4px 10px;font-size:12.5px}button.dan{border-color:#f2b8b8;color:var(--red)}button.dan:hover{background:var(--redbg);border-color:var(--red)}
button:disabled{opacity:.5;cursor:default;transform:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.hero{background:linear-gradient(120deg,var(--navy2) 0,var(--blue) 55%,var(--sky) 100%);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh2);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h2{margin:0;font-size:20px}.hero p{margin:2px 0 0;opacity:.9;font-size:13px}
.hero .hb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff}
.hero .hb:hover{background:rgba(255,255,255,.30)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sky)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:700;color:var(--navy);margin-top:3px;white-space:nowrap}
.kpi.r:before{background:var(--red)}.kpi.r .v{color:var(--red)}.kpi.g:before{background:#43a047}.kpi.o:before{background:#f08a24}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;margin-bottom:8px;border-left:5px solid;transition:transform .15s,box-shadow .15s}
.al:hover{transform:translateX(3px);box-shadow:var(--sh)}
.al.red{background:var(--redbg);border-color:var(--red)}.al.amber{background:var(--amberbg);border-color:#e6a821}
.al.orange{background:var(--orangebg);border-color:#f08a24}.al.blue{background:var(--pale);border-color:var(--blue)}.al.green{background:var(--greenbg);border-color:#43a047}
.al .ic{font-size:18px;line-height:1.2}.al .tx{flex:1}.al b{color:var(--ink)}
.al a{color:var(--navy2);font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#eef3f7;color:#5f7286}
.c-red{background:var(--redbg);color:var(--red)}.c-amber{background:var(--amberbg);color:var(--amber)}.c-orange{background:var(--orangebg);color:var(--orange)}
.c-green{background:var(--greenbg);color:var(--green)}.c-blue{background:var(--pale);color:var(--navy2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ac{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s;border-top:4px solid var(--sky2)}
.ac:hover{border-color:var(--sky);transform:translateY(-3px);box-shadow:var(--sh2)}
.ac h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
.bar{height:10px;background:var(--pale);border-radius:6px;overflow:hidden;margin:8px 0 3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:6px;transition:width .6s ease}
.bar i.w{background:linear-gradient(90deg,#ffd166,#e6a821)}.bar i.x{background:linear-gradient(90deg,#ff8a80,var(--red))}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:var(--pale);color:var(--navy);text-align:left;font-weight:700;padding:8px 9px;white-space:nowrap;border-bottom:2px solid var(--sky2)}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--pale2)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tbody tr:hover td{background:#e3f2fd}
input,select,textarea{font:inherit;padding:8px 9px;border:1px solid #c6dcec;border-radius:9px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,184,240,.25)}
textarea{min-height:60px}
td input,td select{padding:4px 6px;border-color:transparent;background:transparent}
td input:hover{border-color:#c6dcec;background:#fff}
td input:focus{background:#fff}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh)}
.tabs button{border:none;border-radius:9px;background:none;padding:8px 14px;box-shadow:none}
.tabs button:hover{background:var(--pale);transform:none}
.tabs button.on{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff}
.msg{padding:11px 13px;border-radius:11px;margin-bottom:12px}
.msg.err{background:var(--redbg);color:var(--red)}.msg.ok{background:var(--greenbg);color:var(--green)}.msg.info{background:var(--pale);color:var(--navy2)}
.modal{position:fixed;inset:0;background:rgba(18,52,94,.40);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 10px;overflow:auto}
.mb{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(18,52,94,.30);border-top:5px solid var(--sky);animation:fade .2s ease}
.mb h3{margin:0 0 12px;color:var(--navy)}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#login{max-width:380px;margin:60px auto;border-top:5px solid var(--sky)}
.big{font-size:22px;font-weight:700;color:var(--navy)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(18,52,94,.30);animation:fade .2s ease}
@media (max-width:700px){
  header{backdrop-filter:none;background:#fff}
  .hw{gap:8px}.logo{height:30px}.ht h1{font-size:15px}
  nav{flex-wrap:nowrap;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:0;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px;z-index:30;box-shadow:0 -4px 14px rgba(30,100,170,.12)}
  nav a{padding:5px 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;line-height:1.25;position:relative}
  nav a .cnt{position:absolute;top:0;right:0}
  .hide-m{display:none}
  .hero{padding:14px 16px}.hero h2{font-size:17px}
}

#tIt td input{min-width:54px}#tIt td:nth-child(2) input{min-width:230px}#tIt td:nth-child(3) input{min-width:60px}#tIt td:nth-child(4) input{min-width:70px}#tIt td:nth-child(5) input{min-width:100px}#tIt td:nth-child(7) input{min-width:100px}
tr.prueba td{background:repeating-linear-gradient(45deg,#f6f0ff,#f6f0ff 10px,#efe6ff 10px,#efe6ff 20px)!important}
.ac.prueba{background:repeating-linear-gradient(45deg,#f6f0ff,#f6f0ff 10px,#efe6ff 10px,#efe6ff 20px);border-top-color:#9b6dd6}
.c-test{background:#ede1ff;color:#6a3fb3}
/* calculadora */
#view td.n:not(:has(input)):not(:empty),#view .kpi .v{cursor:pointer}
#view td.n:not(:has(input)):hover,#view .kpi .v:hover{text-decoration:underline dotted;text-underline-offset:3px}
.csel{background:#fff3b8!important;box-shadow:inset 0 0 0 2px #e6a821;border-radius:4px}
.cneg{background:#fde0e0!important;box-shadow:inset 0 0 0 2px var(--red);border-radius:4px}
#calc{position:fixed;right:16px;bottom:16px;z-index:3000;background:#fff;border:1px solid var(--sky2);border-radius:14px;box-shadow:var(--sh2);min-width:240px;max-width:340px;font-size:13px}
#calc .ch{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;border-radius:13px 13px 0 0;cursor:pointer}
#calc .cb{padding:8px 12px;max-height:220px;overflow:auto}
#calc .ct{padding:8px 12px;border-top:1px solid var(--line);font-weight:700;color:var(--navy)}
#calc .ci{display:flex;gap:6px;align-items:center;padding:2px 0;border-bottom:1px dashed var(--line)}
#calc .ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#calc button{padding:2px 7px;font-size:11px}
@media (max-width:700px){#calc{bottom:70px;right:8px;left:8px;max-width:none}}
#calc.mini{left:auto;min-width:0;opacity:.9}
@media print{#calc{display:none}}
.mb.wide{max-width:1000px}
@media (min-width:1100px){.mb.wide{max-width:min(1000px,calc(100vw - 400px));margin-right:350px}}   /* deja libre la derecha para la calculadora */
#calc .ch{touch-action:none;user-select:none}
@media print{header,nav,button,.noprint,#msg{display:none!important}main{padding:0;max-width:none}body{background:#fff}#ofBox{width:100%!important;padding:0!important}@page{size:A4;margin:14mm}}
.gbars{display:flex;gap:10px;align-items:flex-end;height:170px;padding:4px 2px 0}.gb{flex:1;text-align:center;min-width:40px}.gbb{height:130px;display:flex;gap:3px;align-items:flex-end;justify-content:center}.gbb div{width:42%;border-radius:4px 4px 0 0;min-height:1px}
.nohoro .hcolin{display:none}.nohoro table th:nth-child(n+3):nth-child(-n+6),.nohoro table td:nth-child(n+3):nth-child(-n+6){display:none}
.cpwrap{overflow-x:auto;padding:4px 0 20px}
.cptool{position:sticky;top:6px;z-index:25;padding:10px 14px;box-shadow:0 6px 18px rgba(20,60,110,.18)}
.cp{font-family:Calibri,Arial,sans-serif;color:#1b2430;font-size:14.5px;line-height:1.35}
.cp .pg{width:216mm;min-height:279mm;box-sizing:border-box;padding:14mm 18mm 12mm;margin:0 auto 16px;background:#fff;box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column;page:cp}
.cp .pgb{flex:1;padding-top:8mm}
.cp p{margin:0 0 9px}
.cp ol,.cp ul{margin:0 0 9px;padding-left:26px}.cp ol{list-style:none;counter-reset:cpn}.cp ol>li{counter-increment:cpn;position:relative}.cp ol>li::before{content:counter(cpn) ".";position:absolute;left:-24px;width:20px;text-align:left}.cp ol[type=a]>li::before{content:counter(cpn, lower-alpha) "."}.cp li{margin:0 0 6px;text-align:justify}.cp li li{margin-bottom:3px}
.cp .cpx p,.cp .cpx li{text-align:justify}.cp .cpx p:first-child:has(br){text-align:left}
.cph{width:calc(100% - 2px);border-collapse:collapse;font-size:12px}.cph td{border:1px solid #9fb3c8;padding:4px 7px;vertical-align:middle}
.cph .cpl{width:23%;text-align:center}.cph .cpl img{height:40px;width:auto;max-width:100%;object-fit:contain;image-rendering:auto}.cph .cpt{text-align:center;font-weight:700;font-size:14px}.cph .cpr{width:30%}.cph .cpr p{margin:1px 0}
.cpf{text-align:right;font-size:12px;margin:10px 0 0!important}
.cps{font-size:14.5px;font-weight:700;margin:4px 0 10px;color:#1b2430;text-decoration:underline;text-underline-offset:3px}
.cpport{text-align:center;padding:40mm 0 30mm}.cpcli{font-size:20px;font-weight:700;margin-bottom:28mm!important}.cpcot{font-size:20px;font-weight:700}.cpcot2{font-size:17px;font-weight:700}
.cprev{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}.cprev th{background:#1f3864;color:#fff;padding:5px;border:1px solid #9fb3c8}.cprev td{border:1px solid #9fb3c8;padding:6px;height:52px}
.cpfirma{text-align:right;margin-top:26px}.cpfirma img{height:76px;display:block;margin:0 0 -2px auto}.cpfirma p{margin:0!important;text-align:right}
.cptab{margin:6px 0 12px}
.cptest{border:3px solid #c62828;color:#c62828;font-weight:700;font-size:18px;text-align:center;padding:4px;margin-top:8px;letter-spacing:2px}
.cpx{outline:none;border-radius:6px}.cpx:hover{box-shadow:0 0 0 2px #e3eef9}.cpx:focus{box-shadow:0 0 0 2px #9cc3ea;background:#fbfdff}
.cp [data-v]{border-bottom:2px dotted #3d7fd1}.cp .cpfal{background:#fff3b8;border-bottom-color:#e6a821}
.cpreset{float:right;margin:-4px 0 4px 8px}
.cpchk{margin:0;padding-left:4px;list-style:none;font-size:13px}.cpchk li{padding:3px 0;border-bottom:1px dashed var(--line)}.cpchk li.red{color:#b3261e}.cpchk li.orange{color:#9a5b00}
@page cp{size:letter;margin:14mm 18mm 12mm 18mm}
.cp,.cp *,#ofBox,#ofBox *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
mark.cpfal{background:#fff3b8;color:inherit}
@media print{mark.cpfal{background:none}.cpwrap{overflow:visible;padding:0}.cp .pg{width:auto;min-height:252mm;margin:0;padding:0;border:none;box-shadow:none;break-after:page}.cp .pg:last-child{break-after:auto}.cp [data-v]{border-bottom:none}.cp .cpfal{background:none}.cpx:hover,.cpx:focus{box-shadow:none;background:none}body.printcp main{max-width:none}}
.ofwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px}
a.btn{display:inline-block}
</style>
</head>

<script>
(() => {
'use strict';
/* ================= CONFIGURACIÓN (mismo proyecto Supabase del panel) ================= */
const SUPABASE_URL = 'https://noauwcqdxkvnbnyhqhed.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BR8Aq9CMZ4YoHEKysHzk-w_OnBJAMOW';   // clave pública (nunca la service_role)
/* ===================================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = v => (v < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(+v || 0)).toLocaleString('es-CL');

const dUTC = s => { if (!s) return null; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return Date.UTC(y, m - 1, d); };

/* ---------------- Supabase: sesión compartida con el panel ---------------- */
const AUTHK = 'terracop_sb_session_v1';
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(AUTHK) || 'null'); } catch (e) { SESSION = null; }
const saveSession = () => { try { SESSION ? localStorage.setItem(AUTHK, JSON.stringify(SESSION)) : localStorage.removeItem(AUTHK); } catch (e) {} };
async function authReq(body, grant) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method: 'POST', headers: {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(grant === 'password' ? 'Correo o contraseña incorrectos.' : 'Sesión expirada.');
  return {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || body.email || ''};
}
async function ensureSession() {
  if (!SESSION || !SESSION.refresh_token) return false;
  if (Date.now() > (SESSION.expires_at || 0) - 60000) {
    try { const email = SESSION.email; SESSION = await authReq({refresh_token: SESSION.refresh_token}, 'refresh_token'); SESSION.email = SESSION.email || email; saveSession(); }
    catch (e) { SESSION = null; saveSession(); return false; }
  }
  return true;
}
async function api(path, opts = {}) {
  if (!await ensureSession()) throw new Error('SESSION');
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {...opts, headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SESSION.access_token, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (r.status === 401) { SESSION = null; saveSession(); throw new Error('SESSION'); }
  const t = await r.text();
  if (!r.ok) { let m = ''; try { m = JSON.parse(t).message; } catch (e) {} throw new Error(r.status === 403 ? 'Su usuario no tiene permiso para esta acción.' : (m || 'Error del servidor (' + r.status + ').')); }
  return t ? JSON.parse(t) : null;
}
const ins = (t, o) => api(t, {method: 'POST', headers: {Prefer: 'return=representation'}, body: JSON.stringify(o)}).then(r => r[0]);
const upd = (t, id, o) => api(`${t}?id=eq.${id}`, {method: 'PATCH', headers: {Prefer: 'return=representation'}, body: JSON.stringify(o)}).then(r => r[0]);
const del = (t, id) => api(`${t}?id=eq.${id}`, {method: 'DELETE'});

/* ---------------- Datos en memoria ---------------- */
const D = {};
const TABLES = ['parametros', 'mandantes', 'equipo_tipos', 'personal', 'materiales', 'flota', 'arriendos', 'periodos', 'horometros', 'edps'];
async function loadAll() {

  TABLES.forEach((t, i) => { D[t] = res[i] || []; });
  try { const [c, a] = await Promise.all([api('cotizaciones?select=*&limit=10000'), api('ajustes?select=*')]); D.cotizaciones = c || []; D.ajustesMap = {}; (a || []).forEach(x => { D.ajustesMap[x.clave] = x.valor; }); D.sinCot = false; }
  catch (e) { if (e.message === 'SESSION') throw e; D.cotizaciones = []; D.ajustesMap = {}; D.sinCot = true; }
  try { D.proveedor_equipos = await api('proveedor_equipos?select=*') || []; D.sinProv = false; } catch (e) { if (e.message === 'SESSION') throw e; D.proveedor_equipos = []; D.sinProv = true; }
  try { D.licitaciones = await api('licitaciones?select=*&limit=10000') || []; D.sinLic = false; } catch (e) { if (e.message === 'SESSION') throw e; D.licitaciones = []; D.sinLic = true; }
  D.P = {}; D.parametros.forEach(p => { D.P[p.clave] = +p.valor; });
  D.hasConteo = D.arriendos.some(a => 'conteo_dias' in a);

  D.hasFallas = D.arriendos.some(a => 'descuenta_fallas' in a);
  D.hasPropiedad = D.flota.some(f => 'propiedad' in f);
  D.hasDoc = D.cotizaciones.some(c => 'doc' in c);
  D.hasCC = D.cotizaciones.some(c => 'compartidos' in c);
  D.hasArea = D.arriendos.some(a => 'area' in a);
  setTimeout(guardarUbic, 1500);
  if (!('mantencion_250' in D.P)) { const row = {clave: 'mantencion_250', valor: 1500000, descripcion: 'Valor por mantención de 250 h cobrada al mandante (traslado ida y vuelta de personal y vehículo). No aplica a mandantes con mantención incluida (Fenix).'};
    api('parametros', {method: 'POST', headers: {Prefer: 'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify([row])}).then(() => { D.parametros.push(row); D.P.mantencion_250 = row.valor; }).catch(() => {}); }
}
const P = (k, def) => (D.P && D.P[k] != null && !isNaN(D.P[k])) ? D.P[k] : def;
const byId = (t, id) => D[t].find(x => x.id === id);
const mandante = a => byId('mandantes', a.mandante_id) || {};
const unidadMod = m => ({hora: 'h', dia: 'días', mes: 'mes', global: 'gl'}[m] || '');
const esPruebaCot = c => /prueba/i.test([c.referencia, c.notas, c.cliente, ((D.mandantes || []).find(m => m.id === c.mandante_id) || {}).nombre].join(' '));
const esPruebaArr = a => /prueba/i.test([a.descripcion, a.notas, ((D.mandantes || []).find(m => m.id === a.mandante_id) || {}).nombre].join(' ')) || (D.cotizaciones || []).some(c => c.arriendo_id === a.id && esPruebaCot(c));
const chipPrueba = '<span class="chip c-test">🧪 PRUEBA</span>';
const verU = (a, v, d = 0) => a.modalidad === 'mes' ? nf(v * 30) : nf(v, d);            // los meses se muestran en días
const uVer = a => a.modalidad === 'mes' ? 'días' : unidadMod(a.modalidad);

/* ---------------- Cálculos por arriendo ---------------- */
function calc(a) {
  const hor = D.horometros.filter(h => h.arriendo_id === a.id);
  const edps = D.edps.filter(e => e.arriendo_id === a.id).sort((x, y) => x.n - y.n);
  const pers = D.periodos.filter(p => p.arriendo_id === a.id).sort((x, y) => x.n - y.n);
  const base = +a.base_cobro || (a.modalidad === 'hora' ? P('base_ep_horas', 180) : 30);
  const hoy = todayISO();
  let avance = 0, ultimo = null, ultimoFin = null;
  const enEdp = edps.reduce((s, e) => s + (+e.cantidad || 0), 0);
  const corte = edps.reduce((m, e) => (e.hasta && e.hasta < hoy && (!m || e.hasta > m)) ? e.hasta : m, null);   // último corte ya cerrado
  const edpAbierto = edps.find(e => !e.hasta || e.hasta >= hoy) || null;   // EDP que cubre el período en curso
  let pend, arrastre = 0;
  const cortes = [];                         // detalle de cada corte de EDP cerrado
  const hrs = h => { const d = (+h.h_fin || 0) - (+h.h_ini || 0); return h.h_fin != null && h.h_ini != null && d > 0 ? d : 0; };
  const NOCOBRA = a.descuenta_fallas ? ['falla_terracop', 'taller'] : [];
  let baseEf = base, diasFalla = 0;
  if (a.modalidad === 'hora') {
    hor.forEach(h => { avance += hrs(h); });
    if (hor.length) { const u = hor[hor.length - 1]; ultimo = u.fecha; ultimoFin = u.h_fin; }
    // Horas que pasan al siguiente período: si se trabajó más de lo cobrado, la diferencia se arrastra;
    // si se trabajó menos (mínimo cobrado), no se descuenta.
    let prev = null;
    edps.filter(e => e.hasta && e.hasta < hoy).sort((x, y) => x.hasta.localeCompare(y.hasta)).forEach(e => {
      const trab = hor.filter(h => (!prev || h.fecha > prev) && h.fecha <= e.hasta).reduce((t, h) => t + hrs(h), 0);
      const tot = trab + arrastre, nuevo = Math.max(0, Math.round((tot - (+e.cantidad || 0)) * 10) / 10);
      cortes.push({edp: e, trab, previo: arrastre, cobrado: +e.cantidad || 0, arrastre: nuevo});
      arrastre = nuevo; prev = e.hasta;
    });
    pend = arrastre + hor.filter(h => !prev || h.fecha > prev).reduce((t, h) => t + hrs(h), 0);
    if (a.descuenta_fallas) {   // mínimo proporcional: se descuenta base/30 por cada día de falla Terracop o taller del período en curso
      diasFalla = hor.filter(h => ['falla_terracop', 'taller'].includes(h.estado) && (!prev || h.fecha > prev)).length;
      baseEf = Math.max(0, Math.round((base - base / 30 * diasFalla) * 10) / 10);
    }
  } else if (a.modalidad === 'global') {
    avance = enEdp; pend = 0;
  } else {
    const fin = a.fecha_fin && a.fecha_fin < hoy ? a.fecha_fin : hoy, k = a.modalidad === 'mes' ? 30 : 1;
    if (hor.length) { const u = hor[hor.length - 1]; ultimo = u.fecha; ultimoFin = u.h_fin; }
    const cobra = hor.filter(h => !NOCOBRA.includes(h.estado));
    if (a.conteo_dias === 'reportados') {                     // se cobran los días con reporte (sin fallas Terracop ni taller)
      avance = cobra.length / k; pend = cobra.filter(h => !corte || h.fecha > corte).length / k;
    } else {                                                  // días corridos, descontando fallas Terracop y taller
      if (a.fecha_inicio && fin >= a.fecha_inicio) avance = (days(a.fecha_inicio, fin) + 1 - hor.filter(h => NOCOBRA.includes(h.estado) && h.fecha <= fin).length) / k;
      const ini = corte ? addDays(corte, 1) : a.fecha_inicio;
      pend = ini && fin >= ini ? (days(ini, fin) + 1 - hor.filter(h => NOCOBRA.includes(h.estado) && h.fecha >= ini && h.fecha <= fin).length) / k : 0;
    }
  }
  const horasReg = hor.reduce((t, h) => { const d = (+h.h_fin || 0) - (+h.h_ini || 0); return t + (h.h_fin != null && h.h_ini != null && d > 0 ? d : 0); }, 0);
  const monto = e => (+e.monto_arriendo || 0) + (+e.monto_mov || 0) + (+e.monto_desmov || 0) + (+e.monto_otros || 0);
  const enviado = edps.filter(e => e.estado !== 'borrador').reduce((s, e) => s + monto(e), 0);
  const vendidoOC = pers.filter(p => p.estado === 'con_oc').reduce((s, p) => s + (+p.cantidad || 0) * (+p.tarifa || 0), 0);
  const vendidoPal = pers.filter(p => p.estado !== 'con_oc').reduce((s, p) => s + (+p.cantidad || 0) * (+p.tarifa || 0), 0);
  const movTot = (+a.movilizacion || 0) + (+a.desmovilizacion || 0);
  const desmovCobrada = edps.some(e => (+e.monto_desmov || 0) > 0);
  const movCobrada = edps.some(e => (+e.monto_mov || 0) > 0);
  const diasFin = a.fecha_fin ? days(hoy, a.fecha_fin) : null;
  return {baseEf, diasFalla, cortes, arrastre, horasReg, edpAbierto, hor, edps, pers, base, avance, enEdp, pend, enviado, vendidoOC, vendidoPal, movTot, desmovCobrada, movCobrada, diasFin, ultimo, ultimoFin, monto};
}

/* ---------------- Alertas ---------------- */
function alertas() {
  const L = [], hoy = todayISO();
  const uH = P('umbral_horas', 0.85), uD = P('umbral_dias', 5), dHes = P('dias_hes', 10), dOc = P('dias_sin_oc', 7);
  D.arriendos.forEach(a => {
    const c = calc(a), nom = (esPruebaArr(a) ? '🧪 ' : '') + esc(a.descripcion), m = esc(mandante(a).nombre || ''), link = `<a href="#a-${a.id}">Abrir</a>`;
    const activo = a.estado === 'palabra' || a.estado === 'con_oc';
    if (activo && a.modalidad === 'hora') {
      if (c.pend >= c.baseEf) L.push({lv: 'red', ic: '🔴', t: `<b>${nom}</b> (${m}): cumplió ${nf(c.pend)} de ${nf(c.baseEf)} h${c.diasFalla ? ` (mínimo ajustado por ${c.diasFalla} día(s) de falla)` : ''}. ${c.edpAbierto ? `<b>Cerrar EDP N° ${c.edpAbierto.n}</b>` : '<b>Confeccionar EDP</b>'} y confirmar con el mandante si prorroga o termina. ${link}`});
      else if (c.pend >= c.baseEf * uH) L.push({lv: 'amber', ic: '🟡', t: `<b>${nom}</b> (${m}): va en ${nf(c.pend)} de ${nf(c.baseEf)} h. <b>Avisar al mandante</b>: ¿prórroga o término? ${link}`});
      if (c.ultimo && days(c.ultimo, hoy) > 2) L.push({lv: 'blue', ic: '📋', t: `<b>${nom}</b>: último horómetro registrado el ${fd(c.ultimo)}. ${link}`});
    }
    if (activo && a.modalidad !== 'hora' && a.conteo_dias === 'reportados' && c.ultimo && days(c.ultimo, hoy) > 2) L.push({lv: 'blue', ic: '📋', t: `<b>${nom}</b>: último reporte diario registrado el ${fd(c.ultimo)}. ${link}`});
    if (activo && c.diasFin != null && a.modalidad !== 'hora') {   // por hora: el término lo marcan las horas, no la fecha
      if (c.diasFin < 0) L.push({lv: 'red', ic: '⏰', t: `<b>${nom}</b> (${m}): el período venció el ${fd(a.fecha_fin)}. Registrar prórroga o terminar servicio. ${link}`});
      else if (c.diasFin <= uD) L.push({lv: 'amber', ic: '⏳', t: `<b>${nom}</b> (${m}): termina el ${fd(a.fecha_fin)} (en ${c.diasFin} días). Consultar prórroga o término. ${link}`});
    }
    if (activo && a.modalidad !== 'hora' && a.modalidad !== 'global' && !c.edpAbierto && c.pend >= c.base) L.push({lv: 'red', ic: '🔴', t: `<b>${nom}</b> (${m}): ${verU(a, c.pend)} ${uVer(a)} sin cobrar. <b>Confeccionar EDP</b>. ${link}`});
    c.pers.filter(p => p.estado !== 'con_oc').forEach(p => {
      const d = p.desde && p.desde <= hoy ? days(p.desde, hoy) : 0;
      L.push({lv: d >= dOc ? 'red' : 'orange', ic: '📄', t: `<b>${nom}</b>: período ${p.n} (${p.tipo === 'inicial' ? 'arriendo inicial' : 'prórroga'}) adjudicado <b>sin OC/SolPed</b>${p.desde ? (p.desde > hoy ? ' (inicia el ' : ' (desde el ') + fd(p.desde) + ')' : ''}. Pedir la OC. ${link}`});
    });
    c.edps.forEach(e => {
      if (e.estado === 'borrador') L.push({lv: 'blue', ic: '✉️', t: `<b>${nom}</b>: EDP N° ${e.n} (${clp(c.monto(e))}) <b>por enviar</b> al mandante. ${link}`});
      else if (a.requiere_hes && e.hes_estado !== 'recibida' && e.hes_estado !== 'no_aplica') {
        const d = e.fecha_envio ? days(e.fecha_envio, hoy) : null;
        const ocT = e.oc ? ` (OC/SolPed N° <b>${esc(e.oc)}</b>)` : '', env = e.fecha_envio ? ' el ' + fd(e.fecha_envio) : '';
        if (d != null && d >= dHes) L.push({lv: 'red', ic: '🧾', t: `<b>${nom}</b>: EDP N° ${e.n} enviado${env}, lleva <b>${d} días sin HES</b>. <b>Pedir la HES directamente al emisor</b>${ocT}. ${link}`});
        else if (e.hes_estado === 'solicitada') L.push({lv: 'orange', ic: '🧾', t: `<b>${nom}</b>: EDP N° ${e.n} <b>aprobado</b>${e.aprobacion ? ' (' + esc(e.aprobacion) + ')' : ''}, HES en emisión. ${link}`});
        else L.push({lv: 'orange', ic: '🧾', t: `<b>${nom}</b>: EDP N° ${e.n} enviado${env}, <b>esperando aprobación</b> (correo "favor emitir HES")${d != null ? ` · ${d} día(s)` : ''}. ${link}`});
      } else if (!a.requiere_hes && !e.aprobacion) L.push({lv: 'orange', ic: '✅', t: `<b>${nom}</b>: EDP N° ${e.n} enviado, falta registrar la <b>aprobación del cliente</b>. ${link}`});
      else if (!e.entregado_finanzas) L.push({lv: 'green', ic: '💼', t: `<b>${nom}</b>: EDP N° ${e.n} listo (${a.requiere_hes ? 'HES ' + esc(e.hes_numero || '') : 'aprobado'}). <b>Entregar a Finanzas</b>. ${link}`});
    });
    if ((a.estado === 'terminado') && (+a.desmovilizacion || 0) > 0 && !c.desmovCobrada)
      L.push({lv: 'red', ic: '🚚', t: `<b>${nom}</b>: servicio terminado, <b>desmovilización ${clp(a.desmovilizacion)} sin cobrar</b>. Incluirla en el EDP final. ${link}`});
  });
  // cotizaciones adjudicadas que quedaron sin arriendo
  (D.cotizaciones || []).filter(c => c.estado === 'adjudicada' && !(c.notas || '').includes('[sin_arriendo]') && (!c.arriendo_id || !byId('arriendos', c.arriendo_id))).forEach(c => {
    L.push({lv: 'orange', ic: '⚠️', t: `<b>Cotización ${esc(nCot(c))}</b> figura <b>adjudicada pero sin arriendo</b> (quizás se borró el arriendo). Use "Pasar a arriendo", cámbiela de estado o elimínela si era una prueba. <a href="#c-${c.id}">Abrir</a> · <a href="#" data-sinarr="${c.id}">Es un servicio, no un arriendo (quitar aviso)</a>`});
  });
  // cotizaciones enviadas que pasaron su validez
  (D.cotizaciones || []).filter(c => c.estado === 'enviada').forEach(c => {
    const env = c.fecha_envio || c.fecha, venc = env ? addDays(env, +c.validez_dias || 10) : null;
    if (venc && venc < hoy) L.push({lv: 'amber', ic: '📝', t: `<b>${esPruebaCot(c) ? '🧪 ' : ''}Cotización ${esc(nCot(c))}</b> (${esc(c.cliente || (byId('mandantes', c.mandante_id) || {}).nombre || '')}): su validez venció hace ${days(venc, hoy)} día(s). ¿Se adjudicó o se perdió? Actualice el estado. <a href="#c-${c.id}">Abrir</a>`});
  });
  const ord = {red: 0, orange: 1, amber: 2, blue: 3, green: 4};
  return L.sort((x, y) => ord[x.lv] - ord[y.lv]);
}

/* ---------------- Navegación ---------------- */
const CAMPOS_COT = ['numero', 'rev', 'fecha', 'mandante_id', 'referencia', 'nota', 'validez_dias', 'items', 'mostrar_iva', 'con_firma', 'estado', 'notas', 'atencion', 'atencion_cargo', 'faena'];
const cotSucia = () => { if (!COT) return false; const src = byId('cotizaciones', COT.id); if (!src) return false; return CAMPOS_COT.some(k => JSON.stringify(COT[k] ?? null) !== JSON.stringify(src[k] ?? null)); };

  }

    ({inicio: vInicio, cotizar: vCotizaciones, gestion: vGestion, ubicacion: vUbicacion, arriendos: vArriendos, flota: vFlota, catalogo: vCatalogo, mandantes: vMandantes}[h] || vInicio)();
  } catch (e) { v.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }

}
window.addEventListener('hashchange', go);

/* ---------------- Vista: Inicio ---------------- */
function vInicio() {
  const L = alertas();
  let vOC = 0, vPal = 0, env = 0, pendEnv = 0, hesP = 0, enFaena = 0;
  D.arriendos.filter(a => !esPruebaArr(a)).forEach(a => {
    const c = calc(a);
    vOC += c.vendidoOC + (c.pers.some(p => p.estado === 'con_oc') ? c.movTot : 0);
    vPal += c.vendidoPal; env += c.enviado;
    c.edps.forEach(e => { if (e.estado === 'borrador') pendEnv += c.monto(e); else if (a.requiere_hes && e.hes_estado !== 'recibida' && e.hes_estado !== 'no_aplica') hesP++; });
    if (a.estado === 'palabra' || a.estado === 'con_oc') enFaena++;
  });
  const hh = new Date().getHours(), saludo = hh < 12 ? 'Buenos días' : hh < 20 ? 'Buenas tardes' : 'Buenas noches';
  const urg = L.filter(x => x.lv === 'red' || x.lv === 'orange').length;
  $('view').innerHTML = `
  <div class="hero"><div style="flex:1;min-width:220px"><h2>${saludo} 👋</h2><p>${new Date().toLocaleDateString('es-CL', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})} · ${urg ? urg + ' aviso(s) importantes por atender' : 'sin avisos urgentes'}</p></div>
  <button class="hb" onclick="location.hash='arriendos'">🚜 Ver arriendos</button><button class="hb" id="hNuevo">+ Nuevo arriendo</button></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Vendido con OC</div><div class="v">${clp(vOC)}</div></div>
    <div class="kpi o"><div class="l">Adjudicado sin OC</div><div class="v">${clp(vPal)}</div></div>
    <div class="kpi g"><div class="l">Enviado en EDP</div><div class="v">${clp(env)}</div></div>
    <div class="kpi" data-pend="env" style="cursor:pointer" title="Ver detalle"><div class="l">EDP por enviar</div><div class="v">${clp(pendEnv)}</div><div class="small muted">Ver detalle ›</div></div>
    <div class="kpi r" data-pend="hes" style="cursor:pointer" title="Ver detalle"><div class="l">HES pendientes</div><div class="v">${hesP}</div><div class="small muted">Ver detalle ›</div></div>
    <div class="kpi"><div class="l">Arriendos activos</div><div class="v">${enFaena}</div></div>
  </div>
  <div class="card"><div class="row"><h2 style="margin:0">Qué hacer hoy</h2><span class="sp"></span><span class="muted small">${L.length} aviso(s) · ${fd(todayISO())}</span></div>
  <div style="margin-top:10px">${L.length ? L.map(x => `<div class="al ${x.lv}"><div class="ic">${x.ic}</div><div class="tx">${x.t}</div></div>`).join('') : '<div class="msg ok">Todo al día. No hay avisos.</div>'}</div></div>`;
  $('hNuevo').onclick = () => formArriendo();
  document.querySelectorAll('[data-pend]').forEach(k => k.onclick = () => verPendientes(k.dataset.pend));
  document.querySelectorAll('[data-sinarr]').forEach(b => b.onclick = e => { e.preventDefault(); const c = byId('cotizaciones', b.dataset.sinarr); if (!c || !confirm(`¿La cotización ${nCot(c)} es un servicio que no lleva arriendo de máquina?\n\nSe quita este aviso. La venta sigue contando en Gestión.`)) return;
    guardar(() => upd('cotizaciones', c.id, {notas: ((c.notas || '') + ' [sin_arriendo]').trim()}), 'Aviso quitado'); });
}

/* ---------------- Vista: Arriendos ---------------- */
const estChip = e => ({cotizado: '<span class="chip">Cotizado</span>', palabra: '<span class="chip c-orange">Adjudicado sin OC</span>', con_oc: '<span class="chip c-blue">Con OC</span>', terminado: '<span class="chip c-amber">Terminado</span>', cerrado: '<span class="chip c-green">Cerrado</span>'}[e] || esc(e));
let filtroArr = 'activos';
function vArriendos() {
  const lst = D.arriendos.filter(a => filtroArr === 'todos' || (filtroArr === 'activos' ? ['palabra', 'con_oc', 'cotizado'].includes(a.estado) : ['terminado', 'cerrado'].includes(a.estado)))
    .sort((x, y) => (y.fecha_inicio || '').localeCompare(x.fecha_inicio || ''));
  $('view').innerHTML = `
  <div class="row" style="margin-bottom:12px">
    <select id="fA" style="width:auto"><option value="activos">Activos</option><option value="terminados">Terminados / cerrados</option><option value="todos">Todos</option></select>
    ${(() => { const P2 = listaPendientes(), tE = P2.env.reduce((t, r) => t + r.monto, 0); return `<button data-pend="env" title="Ver EDP por enviar">📨 EDP por enviar: <b>${P2.env.length}</b>${tE ? ' · ' + clp(tE) : ''}</button><button data-pend="hes" title="Ver HES pendientes" ${P2.hes.length ? 'style="border-color:#e0a020"' : ''}>🧾 HES pendientes: <b>${P2.hes.length}</b></button>`; })()}
    <span class="sp"></span><button class="pri" id="nuevoA">+ Nuevo arriendo / servicio</button>
  </div>
  ${(() => {   // agrupados por mandante (y por área dentro de cada mandante)
    const G = {}; lst.forEach(a => { const m = mandante(a), k = m.id || '_'; (G[k] = G[k] || {m, arr: []}).arr.push(a); });
    let plg = {}; try { plg = JSON.parse(localStorage.getItem('arr_plegados') || '{}'); } catch (e) {}
    const tarjeta = a => {
    const c = calc(a), pct = c.base ? Math.max(0, Math.min(100, c.pend / c.base * 100)) : 0;
    const cls = pct >= 100 ? 'x' : pct >= P('umbral_horas', 0.85) * 100 ? 'w' : '';
    const fl = byId('flota', a.flota_id);
    const tp = esPruebaArr(a), sub = fl && propOf(fl) === 'arriendo';
    return `<div class="ac${tp ? ' prueba' : ''}" data-id="${a.id}" style="${sub && !tp ? 'border-top-color:#f08a24;background:linear-gradient(180deg,#fff7ef,#fff 60%)' : ''}">
      <div class="row"><h3>${esc(a.descripcion)}</h3><span class="sp"></span>${tp ? chipPrueba : ''}${sub ? '<span class="chip c-orange">Subarrendado</span>' : ''}${estChip(a.estado)}</div>
      <div class="muted small">${esc(mandante(a).nombre || '—')} · ${fl ? esc(fl.codigo) + (fl.anio ? ' (' + fl.anio + ')' : '') + ' · ' : ''}${clp(a.tarifa)} / ${unidadMod(a.modalidad)}</div>
      ${a.modalidad === 'global' ? '' : `<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="small">${a.modalidad === 'hora' ? 'Horas' : 'Días'} del período: <b>${verU(a, c.pend)} / ${verU(a, c.base)}</b></div>`}
      <div class="small muted">${a.fecha_fin ? 'Vigente hasta ' + fd(a.fecha_fin) : ''}${c.diasFin != null && ['palabra', 'con_oc'].includes(a.estado) ? ` (${c.diasFin} días)` : ''}</div>
    </div>`; };
    const grupos = Object.values(G).sort((x, y) => (x.m.nombre || 'zzz').localeCompare(y.m.nombre || 'zzz'));
    if (!grupos.length) return '<div class="muted">No hay arriendos en esta vista.</div>';
    return grupos.map(g => { const k = g.m.id || '_', pl = !!plg[k], areas = [...new Set(g.arr.map(a => a.area || ''))];
      const activos = g.arr.filter(a => ['palabra', 'con_oc'].includes(a.estado)).length;
      const cuerpo = areas.length > 1 || areas[0] ? areas.sort((x, y) => !x ? 1 : !y ? -1 : x.localeCompare(y)).map(ar => `<div class="small" style="font-weight:700;color:var(--navy);margin:8px 0 6px">📍 ${ar ? esc(ar) : 'Área sin asignar'}</div><div class="grid">${g.arr.filter(a => (a.area || '') === ar).map(tarjeta).join('')}</div>`).join('') : `<div class="grid">${g.arr.map(tarjeta).join('')}</div>`;
      return `<div class="card" style="padding:10px 14px;margin-bottom:12px"><div class="row" data-plg="${k}" style="cursor:pointer;gap:10px">${g.m.logo ? `<img src="${g.m.logo}" style="height:30px;max-width:120px;object-fit:contain">` : `<span style="width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">${esc((g.m.nombre || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>`}
        <h3 style="margin:0;flex:1">${esc(g.m.nombre || 'Sin mandante')}</h3><span class="small muted">${g.arr.length} equipo(s)${activos !== g.arr.length ? ` · ${activos} activo(s)` : ''}</span><span class="muted">${pl ? '▸' : '▾'}</span></div>
        ${pl ? '' : `<div style="margin-top:8px">${cuerpo}</div>`}</div>`; }).join('');
  })()}`;
  $('fA').value = filtroArr;
  $('fA').onchange = e => { filtroArr = e.target.value; vArriendos(); };
  $('nuevoA').onclick = () => formArriendo();
  document.querySelectorAll('.ac').forEach(el => el.onclick = () => { location.hash = 'a-' + el.dataset.id; });
  document.querySelectorAll('[data-pend]').forEach(k => k.onclick = () => verPendientes(k.dataset.pend));
  document.querySelectorAll('[data-plg]').forEach(h => h.onclick = () => { let plg = {}; try { plg = JSON.parse(localStorage.getItem('arr_plegados') || '{}'); } catch (e) {}
    if (plg[h.dataset.plg]) delete plg[h.dataset.plg]; else plg[h.dataset.plg] = 1; try { localStorage.setItem('arr_plegados', JSON.stringify(plg)); } catch (e) {} vArriendos(); });
}

function opts(list, val, lab, ph) { return (ph != null ? `<option value="">${esc(ph)}</option>` : '') + list.map(x => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(lab(x))}</option>`).join(''); }
function modal(html) { $('mbox').classList.remove('wide'); $('mbox').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; $('mbox').innerHTML = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
async function guardar(fn, okMsg) {
  try { await fn(); await loadAll(); closeModal(); go(); if (okMsg) toast(okMsg); }
  catch (e) { if (e.message === 'SESSION') return showLogin('Su sesión expiró.'); alert(e.message); }
}
const val = id => { const e = $(id); return e ? e.value.trim() : ''; };

function formArriendo(a) {
  const nuevo = !a; a = a || {modalidad: 'hora', base_cobro: P('base_ep_horas', 180), estado: 'palabra', requiere_hes: true, fecha_inicio: todayISO(), movilizacion: 0, desmovilizacion: 0};
  const flota = D.flota.filter(f => f.activo).sort((x, y) => (x.tipo || '').localeCompare(y.tipo || '') || x.codigo.localeCompare(y.codigo));
  modal(`<h3>${nuevo ? 'Nuevo arriendo / servicio' : 'Editar arriendo'}</h3>
  <div class="f">
    <div><label>Equipo de la flota (opcional)</label><select id="fFl">${opts(flota, a.flota_id, flotaLab, '— Servicio sin equipo —')}</select></div>
    <div><label>Descripción</label><input id="fDe" value="${esc(a.descripcion || '')}" placeholder="Ej. Excavadora CAT 320 con operador"></div>
    <div><label>Mandante</label><select id="fMa">${opts(D.mandantes.slice().sort((x, y) => x.nombre.localeCompare(y.nombre)), a.mandante_id, m => m.nombre, '— Elegir —')}<option value="__nuevo">➕ Agregar mandante nuevo…</option></select></div>
    <div><label>N° cotización</label><input id="fCo" value="${esc(a.cotizacion || '')}"></div>
    <div><label>Modalidad de cobro</label><select id="fMo">${['hora', 'dia', 'mes', 'global'].map(m => `<option value="${m}" ${a.modalidad === m ? 'selected' : ''}>${{hora: 'Por hora (horómetro)', dia: 'Por día', mes: 'Por mes', global: 'Global'}[m]}</option>`).join('')}</select></div>
    <div><label>Tarifa neta ($ por unidad)</label><input id="fTa" inputmode="numeric" value="${a.tarifa ?? ''}"></div>
    <div><label>Base por EDP (h o días)</label><input id="fBa" inputmode="numeric" value="${a.base_cobro ?? ''}"></div>
    <div><label>Movilización ($, 1er EDP)</label><input id="fMv" inputmode="numeric" value="${a.movilizacion ?? 0}"></div>
    <div><label>Desmovilización ($, EDP final)</label><input id="fDm" inputmode="numeric" value="${a.desmovilizacion ?? 0}"></div>
    <div><label>Operador</label><input id="fOp" value="${esc(a.operador || '')}"></div>
    <div><label>Fecha inicio</label><input id="fFi" type="date" value="${a.fecha_inicio || ''}"></div>
    <div><label>Vigente hasta (OC / período)</label><input id="fFf" type="date" value="${a.fecha_fin || ''}"></div>
    <div><label>Estado</label><select id="fEs">${[['cotizado', 'Cotizado'], ['palabra', 'Adjudicado de palabra (sin OC)'], ['con_oc', 'Con OC / SolPed'], ['terminado', 'Terminado'], ['cerrado', 'Cerrado']].map(([k, l]) => `<option value="${k}" ${a.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    ${nuevo ? `<div><label>N° OC / SolPed (si ya llegó)</label><input id="fOc"></div>` : ''}
    <div><label>Conteo de días (solo cobro por día o mes)</label><select id="fCd"><option value="corridos" ${a.conteo_dias !== 'reportados' ? 'selected' : ''}>Días corridos</option><option value="reportados" ${a.conteo_dias === 'reportados' ? 'selected' : ''}>Días con reporte</option></select></div>
    <div><label>Días con falla del equipo o en taller</label><select id="fDf"><option value="0" ${!a.descuenta_fallas ? 'selected' : ''}>Se cobra igual el mínimo (180 h / 30 días)</option><option value="1" ${a.descuenta_fallas ? 'selected' : ''}>Se descuentan proporcional</option></select></div>
    ${D.hasArea ? `<div><label>Área del mandante (para el mapa)</label><input id="fAr" list="fArL" value="${esc(a.area || '')}" placeholder="Ej. Construcción, Medio Ambiente"><datalist id="fArL">${[...new Set(D.arriendos.map(x => x.area).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>` : ''}
    <div><label>¿Requiere HES?</label><select id="fHe"><option value="1" ${a.requiere_hes ? 'selected' : ''}>Sí (minera / empresa)</option><option value="0" ${!a.requiere_hes ? 'selected' : ''}>No (particular: aprobación)</option></select></div>
  </div>
  <div style="margin-top:10px"><label>Notas</label><textarea id="fNo">${esc(a.notas || '')}</textarea></div>
  <div id="fWarn" class="small" style="color:var(--orange);margin-top:6px"></div>
  <div class="mf">${!nuevo ? '<button class="dan" id="fDel">Eliminar</button><span class="sp"></span>' : ''}<button id="fCan">Cancelar</button><button class="pri" id="fOk">Guardar</button></div>`);
  const fillFromFlota = () => {
    const f = byId('flota', $('fFl').value); if (!f) return;
    const t = byId('equipo_tipos', f.tipo_id);
    if (!$('fDe').value) $('fDe').value = `${f.tipo ? f.tipo.charAt(0) + f.tipo.slice(1).toLowerCase() : ''} ${f.modelo || ''} (${f.patente || f.codigo})`.trim();
    const lp = +(val('fOp') ? f.tarifa_lista_operador : f.tarifa_lista) || +f.tarifa_lista_operador || +f.tarifa_lista || 0;
    if (!$('fTa').value && lp) { $('fTa').value = Math.round(lp); $('fMo').value = f.unidad_cobro === 'mes' ? 'mes' : 'hora'; }
    $('fWarn').textContent = lp ? `Tarifa sugerida = lista ${val('fOp') || !f.tarifa_lista ? 'con' : 'sin'} operador de la planilla (${clp(lp)} por ${f.unidad_cobro === 'mes' ? 'mes' : 'hm'}). Escriba el precio real de la cotización, por día, hora o mes según corresponda.` : 'Escriba la tarifa de la cotización a mano.';
  };
  $('fFl').onchange = fillFromFlota;
  $('fMa').onchange = async () => {
    if ($('fMa').value === '__nuevo') {
      const nombre = (prompt('Nombre del mandante nuevo:') || '').trim();
      if (!nombre) { $('fMa').value = ''; return; }
      const hes = confirm(`¿"${nombre}" emite HES?\n\nAceptar = Sí (minera / empresa)\nCancelar = No (particular)`);
      try {
        const m = await ins('mandantes', {nombre, requiere_hes: hes});
        D.mandantes.push(m);
        const o = document.createElement('option'); o.value = m.id; o.textContent = m.nombre;
        $('fMa').insertBefore(o, $('fMa').lastElementChild); $('fMa').value = m.id; toast('Mandante agregado');
      } catch (e) { alert(e.message); $('fMa').value = ''; return; }
    }
    const m = byId('mandantes', $('fMa').value); if (m) $('fHe').value = m.requiere_hes ? '1' : '0';
  };
  $('fCan').onclick = closeModal;
  if (!nuevo) $('fDel').onclick = () => {
    if (!confirm('¿Eliminar este arriendo con sus horómetros, períodos y EDP?')) return;
    const cots = (D.cotizaciones || []).filter(c => c.arriendo_id === a.id);
    let accion = null;
    if (cots.length) accion = confirm(`Este arriendo está enlazado a la(s) cotización(es) ${cots.map(nCot).join(', ')}.\n\nAceptar = ELIMINAR también la(s) cotización(es) (si era una prueba)\nCancelar = DEJARLA(S) como "Enviada" (si la cotización es real)`) ? 'borrar' : 'enviada';
    guardar(async () => {
      for (const c of cots) { if (accion === 'borrar') await del('cotizaciones', c.id); else await upd('cotizaciones', c.id, {estado: 'enviada', arriendo_id: null}); }
      await del('arriendos', a.id); location.hash = 'arriendos';
    }, cots.length ? (accion === 'borrar' ? 'Arriendo y cotización eliminados' : 'Arriendo eliminado; la cotización volvió a "Enviada"') : 'Arriendo eliminado');
  };
  $('fOk').onclick = () => {
    if (!val('fDe')) return alert('Escriba una descripción.');
    const o = {flota_id: val('fFl') || null, descripcion: val('fDe'), mandante_id: val('fMa') || null, cotizacion: val('fCo') || null, modalidad: val('fMo'),
      tarifa: num(val('fTa')), base_cobro: num(val('fBa')), movilizacion: num(val('fMv')) || 0, desmovilizacion: num(val('fDm')) || 0, operador: val('fOp') || null,
      fecha_inicio: val('fFi') || null, fecha_fin: val('fFf') || null, estado: val('fEs'), requiere_hes: val('fHe') === '1', notas: val('fNo') || null};
    if (D.hasConteo) o.conteo_dias = val('fCd');
    if (D.hasFallas) o.descuenta_fallas = val('fDf') === '1';
    if (D.hasArea) o.area = val('fAr') || null;
    guardar(async () => {
      if (nuevo) {
        const r = await ins('arriendos', o);
        const oc = val('fOc');
        if (o.estado !== 'cotizado') await ins('periodos', {arriendo_id: r.id, n: 1, tipo: 'inicial', cantidad: o.modalidad === 'global' ? 1 : o.base_cobro, tarifa: o.tarifa, desde: o.fecha_inicio, hasta: o.fecha_fin, estado: oc ? 'con_oc' : 'palabra', oc: oc || null});
        if (oc && o.estado === 'palabra') await upd('arriendos', r.id, {estado: 'con_oc'});
        location.hash = 'a-' + r.id;
      } else await upd('arriendos', a.id, o);
    }, 'Guardado');
  };
}

/* ---------------- Vista: detalle de arriendo ---------------- */
let tabA = 'resumen';
function vArriendo(id) {
  const a = byId('arriendos', id);
  if (!a) { $('view').innerHTML = '<div class="msg err">Arriendo no encontrado.</div>'; return; }
  const c = calc(a), fl = byId('flota', a.flota_id), m = mandante(a);
  const pct = c.base ? Math.max(0, Math.min(100, c.pend / c.base * 100)) : 0;
  $('view').innerHTML = `
  <div class="row" style="margin-bottom:10px"><a href="#arriendos">← Arriendos</a></div>
  <div class="card">
    ${esPruebaArr(a) ? '<div class="msg small" style="background:#ede1ff;color:#6a3fb3;margin-bottom:8px">🧪 <b>Arriendo de PRUEBA</b>: no cuenta en los totales ni aparece en el panel gerencial.</div>' : ''}
    <div class="row"><h2 style="margin:0">${esc(a.descripcion)}</h2>${esPruebaArr(a) ? chipPrueba : ''}${estChip(a.estado)}<span class="sp"></span><button class="sm" id="edA">Editar</button></div>
    <div class="muted small" style="margin-top:4px">${esc(m.nombre || '—')} · ${fl ? esc(fl.codigo + ' · ' + (fl.patente || '')) + (fl.anio ? ' · año ' + fl.anio : '') + ' · ' + propChip(fl) + ' · ' : ''}Cotización ${esc(a.cotizacion || '—')} · ${clp(a.tarifa)} / ${unidadMod(a.modalidad)} · Base ${nf(c.base)} ${unidadMod(a.modalidad)}${a.operador ? ' · Operador: ' + esc(a.operador) : ''}</div>
    <div class="muted small">Inicio ${fd(a.fecha_inicio) || '—'} · Vigente hasta ${fd(a.fecha_fin) || '—'} · Mov. ${clp(a.movilizacion)} ${c.movCobrada ? '✔ cobrada' : '(1er EDP)'} · Desmov. ${clp(a.desmovilizacion)} ${c.desmovCobrada ? '✔ cobrada' : '(EDP final)'} · ${a.requiere_hes ? 'Con HES' : 'Sin HES (particular)'}</div>
    ${a.notas ? `<div class="small" style="margin-top:6px">${esc(a.notas)}</div>` : ''}
    <div class="row" style="margin-top:10px">
      ${['palabra', 'con_oc'].includes(a.estado) ? '<button class="sm" id="bPro">➕ Prorrogar</button><button class="sm" id="bOc">📄 Registrar OC</button><button class="sm dan" id="bFin">⏹ Terminar servicio</button>' : ''}
      <button class="sm pri" id="bEdp">+ Nuevo EDP</button>
    </div>
  </div>
  <div class="tabs">${[['resumen', 'Resumen'], ['horo', a.modalidad === 'hora' ? 'Horómetros' : /martillo|accesorio|ripper|balde|placa compactadora|chancador/i.test(a.descripcion || '') ? 'Uso efectivo' : 'Días y reportes'], ['per', 'Períodos'], ['edp', 'EDP y HES']].map(([k, l]) => `<button data-t="${k}" class="${tabA === k ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div id="tabc"></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tabA = b.dataset.t; vArriendo(id); });
  $('edA').onclick = () => formArriendo(a);
  $('bEdp').onclick = () => formEdp(a);
  if ($('bPro')) { $('bPro').onclick = () => formProrroga(a); $('bOc').onclick = () => formOC(a); $('bFin').onclick = () => formTerminar(a); }
  const T = $('tabc'); T.classList.remove('nohoro');
  if (tabA === 'resumen') {
    T.innerHTML = `<div class="kpis">

/* ---------- Horómetros: estados, filas, edición y exportación ---------- */
const ESTADOS = [['operativo', '✅ Operativo'], ['sin_operacion', '🌧️ Sin operación (clima / contingencia / mandante)'], ['mantencion', '🔧 Mantención programada'], ['falla_terracop', '⚠️ Falla del equipo (Terracop)'], ['falla_mandante', '🧾 Falla por causa del mandante'], ['taller', '🏭 En taller / bajado de faena']];
const estadoOpts = v => ESTADOS.map(([k, l]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${l}</option>`).join('');
const estadoTxt = v => ({operativo: '', sin_operacion: 'Sin operación', mantencion: 'Mantención', falla_terracop: 'Falla equipo', falla_mandante: 'Falla mandante', taller: 'En taller'}[v || 'operativo'] || '');
const estadoChip = v => !v || v === 'operativo' ? '' : `<span class="chip ${['falla_terracop', 'taller'].includes(v) ? 'c-red' : v === 'falla_mandante' ? 'c-orange' : 'c-amber'}">${estadoTxt(v)}</span>`;
function filasHoro(a, c) {
  const L = [], edps = c.edps.filter(e => e.hasta).sort((x, y) => x.hasta.localeCompare(y.hasta));
  let acum = 0, prev = null, k = 0;
  const sep = e => { const ct = c.cortes.find(x => x.edp.id === e.id);
    return `<tr><td colspan="9" style="background:var(--pale);font-size:12px;color:var(--navy2)"><b>✂ Corte EDP N° ${e.n}</b> al ${fd(e.hasta)}${e.fecha_envio ? ' · enviado el ' + fd(e.fecha_envio) : e.estado !== 'borrador' ? ' · ' + e.estado : ' · por enviar'} · cobrado ${nf(e.cantidad, 1)} ${unidadMod(a.modalidad)}${ct ? ` · trabajado ${nf(ct.trab + ct.previo, 1)} h${ct.arrastre ? ` · <b style="color:var(--orange)">${nf(ct.arrastre, 1)} h pasan al período siguiente</b>` : ''}` : ''}</td></tr>`; };
  c.hor.forEach(h => {
    while (k < edps.length && h.fecha > edps[k].hasta) { L.push(sep(edps[k])); acum = 0; k++; }
    const hh = h.h_ini != null && h.h_fin != null ? h.h_fin - h.h_ini : null; if (hh > 0) acum += hh;
    const salto = prev && prev.h_fin != null && h.h_ini != null && +h.h_ini !== +prev.h_fin ? +h.h_ini - +prev.h_fin : 0;
    const saltoR = prev && /^\d+$/.test(prev.n_report || '') && /^\d+$/.test(h.n_report || '') && +h.n_report !== +prev.n_report + 1;
    L.push(`<tr><td>${fd(h.fecha)}</td><td>${esc(h.n_report || '')}${saltoR ? ' <span title="El N° de report no sigue el correlativo" style="cursor:help">⚠</span>' : ''}</td>
      <td class="n">${h.h_ini != null ? nf(h.h_ini, 1) : '—'}${salto ? `<div class="small" style="color:var(--orange)" title="El inicial no calza con el final del día anterior">salto ${salto > 0 ? '+' : ''}${nf(salto, 1)}</div>` : ''}</td>
      <td class="n">${h.h_fin != null ? nf(h.h_fin, 1) : '—'}</td><td class="n"><b>${hh != null ? nf(hh, 1) : '—'}</b></td><td class="n small">${a.modalidad === 'hora' ? nf(acum, 1) : ''}</td>
      <td>${estadoChip(h.estado)}</td><td class="small">${esc(h.obs || '')}</td><td style="white-space:nowrap"><button class="sm" data-eh="${h.id}" title="Corregir">✎</button><button class="sm dan" data-dh="${h.id}" title="Borrar">✕</button></td></tr>`);
    prev = h;
  });
  while (k < edps.length && edps[k].hasta < todayISO()) { L.push(sep(edps[k])); k++; }

const AJ = k => (D.ajustesMap || {})[k] || '';
const codigoCot = c => AJ('codigo_prefijo') + c.numero;
const nCot = c => `${c.numero} rev_${c.rev}`;
const estCot = e => ({borrador: '<span class="chip">Borrador</span>', enviada: '<span class="chip c-blue">Enviada</span>', adjudicada: '<span class="chip c-green">Adjudicada</span>', perdida: '<span class="chip c-red">Perdida</span>', anulada: '<span class="chip">Anulada</span>'}[e] || esc(e));
const FMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fLarga = s => s ? `${+s.slice(8, 10)} de ${FMES[+s.slice(5, 7) - 1]} de ${s.slice(0, 4)}` : '';
function totCot(c) {
  let neto = 0, costo = 0, sinCosto = 0;
  (c.items || []).forEach(it => {
    if (it.tipo !== 'i') return;
    if (it.oculto) { costo += (+it.cantidad || 0) * (+it.costo || 0); return; }   // costo interno: no se cobra ni aparece en la oferta
    const t = (+it.cantidad || 0) * (+it.precio || 0); neto += t;
    if (it.costo != null && it.costo !== '') costo += (+it.cantidad || 0) * (+it.costo || 0); else if (t) sinCosto += t;
  });
  const iva = neto * P('iva', 0.19), conCosto = neto - sinCosto, util = conCosto - costo;
  return {neto, iva, total: neto + iva, costo, util, margen: conCosto ? util / conCosto : 0, sinCosto};
}
function nextNumero() {
  let m = 0;
  D.cotizaciones.forEach(c => { if (c.numero > m) m = c.numero; });
  D.arriendos.forEach(a => { const n = parseInt(a.cotizacion || '', 10); if (n > m && n < 100000) m = n; });
  return m + 1;
}

function lastGroup() { const g = COT.items.filter(i => i.tipo === 'g'); return g.length ? g[g.length - 1].item : ''; }

function catIndex() {
  const M = new Map(), add = (nombre, unidad, costo, fuente) => { if (nombre) M.set(nombre.trim().toLowerCase(), {nombre: nombre.trim(), unidad: unidad || 'gl', costo: costo == null ? null : +costo, fuente}); };
  D.equipo_tipos.forEach(t => add(t.nombre, t.unidad, t.tarifa, 'Equipos'));
  D.materiales.forEach(m => add(m.nombre, m.unidad, m.precio, 'Materiales'));
  D.personal.forEach(p => add(p.cargo, 'HH', p.valor_hh, 'Personal'));
  return M;
}

const normTxt = t => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function ultimoPrecio(T, excluirId) {
  const pal = normTxt(T.nombre).split(/\s+/).filter(w => w.length > 2 || /\d/.test(w)).slice(0, 2);
  const casa = d => { const n = normTxt(d); return pal.every(w => n.includes(w)); };
  const L = [];
  D.cotizaciones.filter(c => c.id !== excluirId && c.estado !== 'anulada').forEach(c => (c.items || []).forEach(it => {
    if (it.tipo === 'i' && !it.oculto && +it.precio && (it.equipo_tipo_id === T.id || casa(it.desc))) L.push({precio: +it.precio, unidad: (it.unidad || '').toLowerCase(), fecha: c.fecha, origen: `Cot. ${nCot(c)}`, mand: c.cliente || (byId('mandantes', c.mandante_id) || {}).nombre || '', estado: c.estado});
  }));
  D.arriendos.forEach(a => { const f = byId('flota', a.flota_id); if (+a.tarifa && ((f && f.tipo_id === T.id) || casa(a.descripcion)))
    L.push({precio: +a.tarifa, unidad: {hora: 'hm', dia: 'día', mes: 'mes', global: 'gl'}[a.modalidad], fecha: a.fecha_inicio, origen: 'Arriendo ' + (a.cotizacion || ''), mand: mandante(a).nombre || '', estado: 'adjudicado'}); });
  return L.sort((x, y) => (y.fecha || '').localeCompare(x.fecha || ''));
}

      ...(val('wOr') === 'sub' ? {proveedor: val('wProv') || 'proveedor', costo_uf: val('wMon') === 'UF' ? num(val('wTa')) : null} : {})});
    if (val('wOr') === 'sub' && !val('wPe') && !D.sinProv && confirm(`¿Guardar "${val('wProv') || 'proveedor'} · ${T.nombre} · ${val('wTa')} ${val('wMon')} / ${val('wU')}" en el catálogo de equipos de proveedores?`)) {
      try { const r = await ins('proveedor_equipos', {proveedor: val('wProv') || 'proveedor', equipo: T.nombre, tipo_id: T.id, unidad: val('wU'), costo_uf: val('wMon') === 'UF' ? num(val('wTa')) : null, costo_clp: val('wMon') === '$' ? num(val('wTa')) : null}); D.proveedor_equipos.push(r); } catch (e) { alert(e.message); } }

      let p2 = c.items.indexOf(g) + 1; while (p2 < c.items.length && c.items[p2].tipo === 'i') p2++;
      const m = c.items.filter(i => i.tipo === 'i' && String(i.item).startsWith(g.item + '.')).length;
      const fl = D.materiales.find(x => /flete|movilizaci/i.test(x.nombre) && +x.precio);
      c.items.splice(p2, 0, {tipo: 'i', item: `${g.item}.${m + 1}`, desc: `Movilización y desmovilización de ${T.nombre.toLowerCase()}`, unidad: 'viaje', cantidad: 2 * (num(val('wN')) || 1), precio: mv, costo: fl ? Math.round(+fl.precio) : null});

}

    rowKey = (c0 + ' ' + (tr.children[1] && !tr.children[1].querySelector('input') ? tr.children[1].innerText : '')).trim().slice(0, 40); lab = rowKey + ' · ' + col; }

function verPendientes(tipo) {
  const {env, hes} = listaPendientes(), esH = tipo === 'hes', rows = esH ? hes : env, tot = rows.reduce((t, r) => t + r.monto, 0);
  const estH = r => r.e.hes_estado === 'solicitada' ? '<span class="chip c-blue">Aprobado · HES en emisión</span>' : '<span class="chip c-orange">Esperando aprobación</span>';
  modal(`<div class="row"><h3 style="margin:0">${esH ? '🧾 HES pendientes' : '📨 EDP por enviar al mandante'}</h3><span class="sp"></span><button id="pdX">Cerrar</button></div>
    <div class="small muted" style="margin:4px 0 10px">${esH ? 'EDP ya enviados que todavía no tienen N° de HES. Pida la HES al emisor de la OC/SolPed.' : 'EDP creados que aún no se envían al mandante.'} Pinche una fila para abrir el arriendo · pinche los montos para sumarlos.</div>
    ${rows.length ? `<div class="tw"><table><thead><tr><th>Equipo / servicio</th><th>Mandante</th><th>EDP</th><th>Período</th><th>OC / SolPed</th>${esH ? '<th>Enviado</th><th class="n">Días</th><th>Estado</th>' : ''}<th class="n">Monto neto</th></tr></thead><tbody>
      ${rows.map(r => `<tr data-pda="${r.a.id}" style="cursor:pointer"><td><b>${esc(r.a.descripcion)}</b></td><td>${esc(r.mand)}</td><td>N° ${r.e.n}</td><td>${fd(r.e.desde)}${r.e.hasta ? ' al ' + fd(r.e.hasta) : ''}</td><td>${esc(r.e.oc || r.a.oc || '—')}</td>
        ${esH ? `<td>${fd(r.e.fecha_envio)}</td><td class="n" style="${r.dias > 10 ? 'color:var(--red);font-weight:700' : ''}">${r.dias ?? '—'}</td><td>${estH(r)}</td>` : ''}<td class="n">${clp(r.monto)}</td></tr>`).join('')}
      <tr style="font-weight:700;background:#f1f5fb"><td colspan="${esH ? 8 : 5}">Total (${rows.length})</td><td class="n">${clp(tot)}</td></tr></tbody></table></div>` : `<div class="msg ok">✓ No hay ${esH ? 'HES pendientes' : 'EDP por enviar'}.</div>`}`);
  $('mbox').classList.add('wide'); $('pdX').onclick = closeModal;
  document.querySelectorAll('[data-pda]').forEach(tr => tr.onclick = () => { closeModal(); location.hash = 'a-' + tr.dataset.pda; });
}
/* ---------------- Ubicación de maquinaria en arriendo ---------------- */
function snapUbic() {
  const hoy = todayISO();
  const items = D.arriendos.filter(a => (a.estado === 'palabra' || a.estado === 'con_oc') && a.modalidad !== 'global' && !esPruebaArr(a)).map(a => {
    const c = calc(a), fl = byId('flota', a.flota_id), m = mandante(a), esH = a.modalidad === 'hora', k = a.modalidad === 'mes' ? 30 : 1;
    const cor = c.edps.reduce((mx, e) => (e.hasta && e.hasta < hoy && (!mx || e.hasta > mx)) ? e.hasta : mx, null);
    const ult = c.hor[c.hor.length - 1], e0 = ult && ult.estado;
    const est = ['falla_terracop', 'taller', 'mantencion'].includes(e0) ? 'falla' : ['sin_operacion', 'falla_mandante'].includes(e0) && ult.fecha >= addDays(hoy, -2) ? 'parada' : 'ok';
    const pat = fl ? (fl.patente || fl.codigo) : ((a.descripcion || '').match(/\(([A-Z]{4}-?\d{2})\)/) || [])[1] || '';
    return {id: a.id, eq: a.descripcion, pat: mqFam(a.descripcion) === 'martillo' ? 'Martillo' : pat, fam: mqFam((a.descripcion || '') + ' ' + (fl ? fl.tipo || '' : '')), mand: m.nombre || '', mid: m.id || '', area: a.area || '',
      u: esH ? 'h' : 'días', prog: Math.round((esH ? c.pend : c.pend * k) * 10) / 10, meta: Math.round((esH ? c.baseEf : c.base * k) * 10) / 10,
      est, ini: cor ? addDays(cor, 1) : a.fecha_inicio || '', ult: c.ultimo || '', corr: !esH && a.conteo_dias !== 'reportados'};
  });
  return {ts: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19), items};
}
async function guardarUbic() {   // deja la foto para el panel de don Nelson (solo si cambió)
  if (D.sinCot || !D.hasArea) return;
  try { const S = snapUbic(), prev = JSON.parse(AJ('ubicacion') || '{}');
    if (JSON.stringify(prev.items || []) === JSON.stringify(S.items) && (prev.ts || '').slice(0, 10) === S.ts.slice(0, 10)) return;
    await api('ajustes', {method: 'POST', headers: {Prefer: 'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify({clave: 'ubicacion', valor: JSON.stringify(S)})}); D.ajustesMap.ubicacion = JSON.stringify(S);
  } catch (e) {}
}
const logosMand = () => Object.fromEntries((D.mandantes || []).filter(m => m.logo).map(m => [m.id, m.logo]));
function vUbicacion() {
  const S = snapUbic();
  $('view').innerHTML = `<div class="row" style="margin-bottom:10px"><div><h2 style="margin:0">📍 Ubicación de maquinaria en arriendo</h2><div class="small muted">Cada máquina avanza por su camino desde el inicio del período hasta la meta (horas o días). Pinche una máquina para abrir su arriendo.</div></div></div>
    ${D.hasArea ? '' : '<div class="msg err">Falta ejecutar <b>sql/17_ubicacion_maquinaria.sql</b> en Supabase para guardar las áreas y los logos.</div>'}
    <div class="card" id="mqBox">${mapaHTML(S, logosMand(), {click: true, areaBtn: D.hasArea, logoBtn: D.hasArea})}</div>`;
  mapaAnimar($('mqBox'));
  $('mqBox').querySelectorAll('[data-mqa]').forEach(r => r.onclick = e => { if (e.target.closest('button')) return; location.hash = 'a-' + r.dataset.mqa; });
  $('mqBox').querySelectorAll('[data-mqarea]').forEach(b => b.onclick = e => { e.stopPropagation(); formArea(byId('arriendos', b.dataset.mqarea)); });
  $('mqBox').querySelectorAll('[data-mqlogo]').forEach(b => b.onclick = () => subirLogoMand(byId('mandantes', b.dataset.mqlogo), vUbicacion));
}
function formArea(a) {
  const ex = [...new Set(D.arriendos.filter(x => x.mandante_id === a.mandante_id && x.area).map(x => x.area))];
  modal(`<h3>Área del mandante · ${esc(a.descripcion)}</h3><div class="small muted">Ej. "Construcción", "Medio Ambiente", "Planta", "Rajo". Las máquinas con la misma área quedan juntas en el esquema.</div>
    <div style="margin-top:10px"><input id="arA" list="arL" value="${esc(a.area || '')}" placeholder="Escriba o elija un área"><datalist id="arL">${ex.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    ${ex.length ? `<div class="row" style="gap:6px;margin-top:8px">${ex.map(x => `<button class="sm" data-arq="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
    <div class="mf"><button id="arC">Cancelar</button><button class="pri" id="arOk">Guardar</button></div>`);
  document.querySelectorAll('[data-arq]').forEach(b => b.onclick = () => { $('arA').value = b.dataset.arq; });
  $('arC').onclick = closeModal; $('arA').focus();
  $('arOk').onclick = () => guardar(() => upd('arriendos', a.id, {area: val('arA') || null}), 'Área guardada');
}
function subirLogoMand(m, despues) {
  if (!m) return; const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { const file = inp.files[0]; if (!file) return;
    const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 400 / im.width, 160 / im.height), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      const out = /png|webp|gif/i.test(file.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.9);
      guardar(() => upd('mandantes', m.id, {logo: out}), 'Logo de ' + m.nombre + ' guardado').then(() => despues && despues()); }; im.src = rd.result; }; rd.readAsDataURL(file); };
  inp.click();
}

/* ---------------- Inicio de sesión ---------------- */
function showLogin(msg) { $('login').hidden = false; $('nav').hidden = true; $('logout').hidden = true; $('view').innerHTML = ''; $('lErr').textContent = msg || ''; }
async function start() {
  if (!await ensureSession()) return showLogin();
  $('login').hidden = true; $('msg').innerHTML = '<div class="msg info">Cargando…</div>';
  try {
    let admin = false;
    try { admin = !!(await api('rpc/es_admin', {method: 'POST', body: '{}'})); } catch (e) { if (e.message === 'SESSION') throw e; }
    $('who').textContent = SESSION.email;
    $('logout').hidden = false;
    if (!admin) { $('msg').innerHTML = '<div class="msg info">Esta sección es solo para el administrador. <a href="index.html">Ir al panel gerencial</a></div>'; return; }
    await loadAll();
    if (!D.parametros.length) { $('msg').innerHTML = '<div class="msg err">Faltan las tablas en Supabase. Ejecute los scripts sql/01_estructura.sql y sql/02_datos.sql.</div>'; return; }
    $('msg').innerHTML = ''; $('nav').hidden = false; go();
  } catch (e) {
    if (e.message === 'SESSION') return showLogin('Su sesión expiró. Ingrese nuevamente.');
    $('msg').innerHTML = `<div class="msg err">${esc(e.message)}${/relation|does not exist|schema cache/i.test(e.message) ? '<br>Ejecute primero los scripts SQL en Supabase.' : ''}</div>`;
  }
}
$('login').addEventListener('submit', async e => {
  e.preventDefault(); $('lErr').textContent = ''; $('lBtn').disabled = true;
  try { SESSION = await authReq({email: val('lEmail'), password: $('lPass').value}, 'password'); saveSession(); $('lPass').value = ''; await start(); }
  catch (err) { $('lErr').textContent = err.message; } finally { $('lBtn').disabled = false; }
});
$('logout').onclick = async () => { try { await fetch(`${SUPABASE_URL}/auth/v1/logout`, {method: 'POST', headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SESSION.access_token}}); } catch (e) {} SESSION = null; saveSession(); location.reload(); };
start();
})();
</script>
