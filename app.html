<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12345e">
<title>Gestión de Arriendos | Grupo Terracop</title>
<style>
:root{--navy:#12345e;--navy2:#1d4a80;--blue:#2b8fd9;--sky:#5bb8f0;--sky2:#9fd6f7;--pale:#e6f4fd;--pale2:#f3faff;--ink:#1b2a3a;--muted:#5f7286;--line:#d7e8f5;--bg:#eef7fd;
--red:#d32f2f;--redbg:#fdecec;--amber:#9a6200;--amberbg:#fff6e0;--orange:#c25400;--orangebg:#fff1e6;--green:#2e7d32;--greenbg:#e9f7ec;
--sh:0 2px 10px rgba(30,100,170,.08);--sh2:0 8px 24px rgba(30,100,170,.16)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#dff1fc 0,#eef7fd 260px,#f5fbff 100%) fixed}
a{color:var(--navy2)}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(30,100,170,.10)}
header:after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--sky))}
.hw{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:40px}
.ht{flex:1;min-width:180px}.ht h1{margin:0;font-size:17px;color:var(--navy);letter-spacing:.2px}.ht .sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;background:var(--pale);padding:4px;border-radius:12px}
nav a{color:var(--navy);text-decoration:none;font-weight:600;padding:7px 12px;border-radius:9px;font-size:13.5px;transition:background .18s,color .18s,transform .18s}
nav a:hover{background:#fff;transform:translateY(-1px)}
nav a.on{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;box-shadow:0 3px 10px rgba(43,143,217,.35)}
nav a .cnt{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:18px 16px 90px}
#view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn{font:inherit;border:1px solid var(--sky2);background:#fff;color:var(--navy2);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;transition:all .18s}
button:hover{background:var(--pale);border-color:var(--blue);transform:translateY(-1px)}
button.pri{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(43,143,217,.30)}
button.pri:hover{box-shadow:0 6px 16px rgba(43,143,217,.40);filter:brightness(1.06)}
button.sm{padding:4px 10px;font-size:12.5px}button.dan{border-color:#f2b8b8;color:var(--red)}button.dan:hover{background:var(--redbg);border-color:var(--red)}
button:disabled{opacity:.5;cursor:default;transform:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.hero{background:linear-gradient(120deg,var(--navy2) 0,var(--blue) 55%,var(--sky) 100%);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh2);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h2{margin:0;font-size:20px}.hero p{margin:2px 0 0;opacity:.9;font-size:13px}
.hero .hb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff}
.hero .hb:hover{background:rgba(255,255,255,.30)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sky)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:700;color:var(--navy);margin-top:3px;white-space:nowrap}
.kpi.r:before{background:var(--red)}.kpi.r .v{color:var(--red)}.kpi.g:before{background:#43a047}.kpi.o:before{background:#f08a24}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;margin-bottom:8px;border-left:5px solid;transition:transform .15s,box-shadow .15s}
.al:hover{transform:translateX(3px);box-shadow:var(--sh)}
.al.red{background:var(--redbg);border-color:var(--red)}.al.amber{background:var(--amberbg);border-color:#e6a821}
.al.orange{background:var(--orangebg);border-color:#f08a24}.al.blue{background:var(--pale);border-color:var(--blue)}.al.green{background:var(--greenbg);border-color:#43a047}
.al .ic{font-size:18px;line-height:1.2}.al .tx{flex:1}.al b{color:var(--ink)}
.al a{color:var(--navy2);font-weight:700}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#eef3f7;color:#5f7286}
.c-red{background:var(--redbg);color:var(--red)}.c-amber{background:var(--amberbg);color:var(--amber)}.c-orange{background:var(--orangebg);color:var(--orange)}
.c-green{background:var(--greenbg);color:var(--green)}.c-blue{background:var(--pale);color:var(--navy2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ac{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s;border-top:4px solid var(--sky2)}
.ac:hover{border-color:var(--sky);transform:translateY(-3px);box-shadow:var(--sh2)}
.ac h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
.bar{height:10px;background:var(--pale);border-radius:6px;overflow:hidden;margin:8px 0 3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:6px;transition:width .6s ease}
.bar i.w{background:linear-gradient(90deg,#ffd166,#e6a821)}.bar i.x{background:linear-gradient(90deg,#ff8a80,var(--red))}
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:var(--pale);color:var(--navy);text-align:left;font-weight:700;padding:8px 9px;white-space:nowrap;border-bottom:2px solid var(--sky2)}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--pale2)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tbody tr:hover td{background:#e3f2fd}
input,select,textarea{font:inherit;padding:8px 9px;border:1px solid #c6dcec;border-radius:9px;background:#fff;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,184,240,.25)}
textarea{min-height:60px}
td input,td select{padding:4px 6px;border-color:transparent;background:transparent}
td input:hover{border-color:#c6dcec;background:#fff}
td input:focus{background:#fff}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh)}
.tabs button{border:none;border-radius:9px;background:none;padding:8px 14px;box-shadow:none}
.tabs button:hover{background:var(--pale);transform:none}
.tabs button.on{background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff}
.msg{padding:11px 13px;border-radius:11px;margin-bottom:12px}
.msg.err{background:var(--redbg);color:var(--red)}.msg.ok{background:var(--greenbg);color:var(--green)}.msg.info{background:var(--pale);color:var(--navy2)}
.modal{position:fixed;inset:0;background:rgba(18,52,94,.40);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 10px;overflow:auto}
.mb{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(18,52,94,.30);border-top:5px solid var(--sky);animation:fade .2s ease}
.mb h3{margin:0 0 12px;color:var(--navy)}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#login{max-width:380px;margin:60px auto;border-top:5px solid var(--sky)}
.big{font-size:22px;font-weight:700;color:var(--navy)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(18,52,94,.30);animation:fade .2s ease}
@media (max-width:700px){
  header{backdrop-filter:none;background:#fff}
  .hw{gap:8px}.logo{height:30px}.ht h1{font-size:15px}
  nav{flex-wrap:nowrap;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:0;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px;z-index:30;box-shadow:0 -4px 14px rgba(30,100,170,.12)}
  nav a{padding:5px 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;line-height:1.25;position:relative}
  nav a .cnt{position:absolute;top:0;right:0}
  .hide-m{display:none}
  .hero{padding:14px 16px}.hero h2{font-size:17px}
}
@media print{header,nav,button{display:none!important}main{padding:0}body{background:#fff}}
</style>
</head>

<script>
(() => {
'use strict';
/* ================= CONFIGURACIÓN (mismo proyecto Supabase del panel) ================= */
const SUPABASE_URL = 'https://noauwcqdxkvnbnyhqhed.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BR8Aq9CMZ4YoHEKysHzk-w_OnBJAMOW';   // clave pública (nunca la service_role)
/* ===================================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = v => (v < 0 ? '-$ ' : '$ ') + Math.round(Math.abs(+v || 0)).toLocaleString('es-CL');
const nf = (v, d = 0) => (+v || 0).toLocaleString('es-CL', {maximumFractionDigits: d});
const num = v => {
  if (v === '' || v == null) return null;
  let t = String(v).replace(/[$\s]/g, '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t) || t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');   // 1.600.000 / 1234,5
  const n = +t; return t !== '' && isFinite(n) ? n : null;                                                          // 1234.5 / 1600000
};
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dUTC = s => { if (!s) return null; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return Date.UTC(y, m - 1, d); };
const days = (a, b) => Math.round((dUTC(b) - dUTC(a)) / 86400000);      // b - a en días
const addDays = (s, n) => new Date(dUTC(s) + n * 86400000).toISOString().slice(0, 10);
const fd = s => s ? s.slice(8, 10) + '-' + s.slice(5, 7) + '-' + s.slice(0, 4) : '';
const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); };

/* ---------------- Supabase: sesión compartida con el panel ---------------- */
const AUTHK = 'terracop_sb_session_v1';
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(AUTHK) || 'null'); } catch (e) { SESSION = null; }
const saveSession = () => { try { SESSION ? localStorage.setItem(AUTHK, JSON.stringify(SESSION)) : localStorage.removeItem(AUTHK); } catch (e) {} };
async function authReq(body, grant) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method: 'POST', headers: {apikey: SUPABASE_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(grant === 'password' ? 'Correo o contraseña incorrectos.' : 'Sesión expirada.');
  return {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || body.email || ''};
}
async function ensureSession() {
  if (!SESSION || !SESSION.refresh_token) return false;
  if (Date.now() > (SESSION.expires_at || 0) - 60000) {
    try { const email = SESSION.email; SESSION = await authReq({refresh_token: SESSION.refresh_token}, 'refresh_token'); SESSION.email = SESSION.email || email; saveSession(); }
    catch (e) { SESSION = null; saveSession(); return false; }
  }
  return true;
}
async function api(path, opts = {}) {
  if (!await ensureSession()) throw new Error('SESSION');
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {...opts, headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SESSION.access_token, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (r.status === 401) { SESSION = null; saveSession(); throw new Error('SESSION'); }
  const t = await r.text();
  if (!r.ok) { let m = ''; try { m = JSON.parse(t).message; } catch (e) {} throw new Error(r.status === 403 ? 'Su usuario no tiene permiso para esta acción.' : (m || 'Error del servidor (' + r.status + ').')); }
  return t ? JSON.parse(t) : null;
}
const ins = (t, o) => api(t, {method: 'POST', headers: {Prefer: 'return=representation'}, body: JSON.stringify(o)}).then(r => r[0]);
const upd = (t, id, o) => api(`${t}?id=eq.${id}`, {method: 'PATCH', headers: {Prefer: 'return=representation'}, body: JSON.stringify(o)}).then(r => r[0]);
const del = (t, id) => api(`${t}?id=eq.${id}`, {method: 'DELETE'});

/* ---------------- Datos en memoria ---------------- */
const D = {};
const TABLES = ['parametros', 'mandantes', 'equipo_tipos', 'personal', 'materiales', 'flota', 'arriendos', 'periodos', 'horometros', 'edps'];
async function loadAll() {
  const res = await Promise.all(TABLES.map(t => api(`${t}?select=*${t === 'horometros' ? '&order=fecha.asc' : ''}&limit=10000`)));
  TABLES.forEach((t, i) => { D[t] = res[i] || []; });
  D.P = {}; D.parametros.forEach(p => { D.P[p.clave] = +p.valor; });
}
const P = (k, def) => (D.P && D.P[k] != null && !isNaN(D.P[k])) ? D.P[k] : def;
const byId = (t, id) => D[t].find(x => x.id === id);
const mandante = a => byId('mandantes', a.mandante_id) || {};
const unidadMod = m => ({hora: 'h', dia: 'días', mes: 'mes', global: 'gl'}[m] || '');

/* ---------------- Cálculos por arriendo ---------------- */
function calc(a) {
  const hor = D.horometros.filter(h => h.arriendo_id === a.id);
  const edps = D.edps.filter(e => e.arriendo_id === a.id).sort((x, y) => x.n - y.n);
  const pers = D.periodos.filter(p => p.arriendo_id === a.id).sort((x, y) => x.n - y.n);
  const base = +a.base_cobro || (a.modalidad === 'hora' ? P('base_ep_horas', 180) : 30);
  const hoy = todayISO();
  let avance = 0, ultimo = null, ultimoFin = null;
  const enEdp = edps.reduce((s, e) => s + (+e.cantidad || 0), 0);
  const corte = edps.reduce((m, e) => (e.hasta && e.hasta < hoy && (!m || e.hasta > m)) ? e.hasta : m, null);   // último corte ya cerrado
  const edpAbierto = edps.find(e => !e.hasta || e.hasta >= hoy) || null;   // EDP que cubre el período en curso
  let pend;
  if (a.modalidad === 'hora') {
    let desdeCorte = 0;
    hor.forEach(h => { const d = (+h.h_fin || 0) - (+h.h_ini || 0); if (d > 0) { avance += d; if (!corte || h.fecha > corte) desdeCorte += d; } });
    if (hor.length) { const u = hor[hor.length - 1]; ultimo = u.fecha; ultimoFin = u.h_fin; }
    pend = desdeCorte;                       // horas trabajadas después del último EDP (el mínimo cobrado no se arrastra)
  } else if (a.modalidad === 'global') {
    avance = enEdp; pend = 0;
  } else {
    const fin = a.fecha_fin && a.fecha_fin < hoy ? a.fecha_fin : hoy, k = a.modalidad === 'mes' ? 30 : 1;
    if (a.fecha_inicio && fin >= a.fecha_inicio) avance = (days(a.fecha_inicio, fin) + 1) / k;
    const ini = corte ? addDays(corte, 1) : a.fecha_inicio;
    pend = ini && fin >= ini ? (days(ini, fin) + 1) / k : 0;
  }
  const monto = e => (+e.monto_arriendo || 0) + (+e.monto_mov || 0) + (+e.monto_desmov || 0) + (+e.monto_otros || 0);
  const enviado = edps.filter(e => e.estado !== 'borrador').reduce((s, e) => s + monto(e), 0);
  const vendidoOC = pers.filter(p => p.estado === 'con_oc').reduce((s, p) => s + (+p.cantidad || 0) * (+p.tarifa || 0), 0);
  const vendidoPal = pers.filter(p => p.estado !== 'con_oc').reduce((s, p) => s + (+p.cantidad || 0) * (+p.tarifa || 0), 0);
  const movTot = (+a.movilizacion || 0) + (+a.desmovilizacion || 0);
  const desmovCobrada = edps.some(e => (+e.monto_desmov || 0) > 0);
  const movCobrada = edps.some(e => (+e.monto_mov || 0) > 0);
  const diasFin = a.fecha_fin ? days(hoy, a.fecha_fin) : null;
  return {edpAbierto, hor, edps, pers, base, avance, enEdp, pend, enviado, vendidoOC, vendidoPal, movTot, desmovCobrada, movCobrada, diasFin, ultimo, ultimoFin, monto};
}

/* ---------------- Alertas ---------------- */
function alertas() {
  const L = [], hoy = todayISO();
  const uH = P('umbral_horas', 0.85), uD = P('umbral_dias', 5), dHes = P('dias_hes', 10), dOc = P('dias_sin_oc', 7);
  D.arriendos.forEach(a => {
    const c = calc(a), nom = esc(a.descripcion), m = esc(mandante(a).nombre || ''), link = `<a href="#a-${a.id}">Abrir</a>`;
    const activo = a.estado === 'palabra' || a.estado === 'con_oc';
    if (activo && a.modalidad === 'hora') {
      if (c.pend >= c.base) L.push({lv: 'red', ic: '🔴', t: `<b>${nom}</b> (${m}): cumplió ${nf(c.pend)} de ${nf(c.base)} h. ${c.edpAbierto ? `<b>Cerrar EDP N° ${c.edpAbierto.n}</b>` : '<b>Confeccionar EDP</b>'} y confirmar con el mandante si prorroga o termina. ${link}`});
      else if (c.pend >= c.base * uH) L.push({lv: 'amber', ic: '🟡', t: `<b>${nom}</b> (${m}): va en ${nf(c.pend)} de ${nf(c.base)} h. <b>Avisar al mandante</b>: ¿prórroga o término? ${link}`});
      if (c.ultimo && days(c.ultimo, hoy) > 2) L.push({lv: 'blue', ic: '📋', t: `<b>${nom}</b>: último horómetro registrado el ${fd(c.ultimo)}. ${link}`});
    }
    if (activo && c.diasFin != null) {
      if (c.diasFin < 0) L.push({lv: 'red', ic: '⏰', t: `<b>${nom}</b> (${m}): el período venció el ${fd(a.fecha_fin)}. Registrar prórroga o terminar servicio. ${link}`});
      else if (c.diasFin <= uD) L.push({lv: 'amber', ic: '⏳', t: `<b>${nom}</b> (${m}): termina el ${fd(a.fecha_fin)} (en ${c.diasFin} días). Consultar prórroga o término. ${link}`});
    }
    if (activo && a.modalidad !== 'hora' && a.modalidad !== 'global' && !c.edpAbierto && c.pend >= c.base) L.push({lv: 'red', ic: '🔴', t: `<b>${nom}</b> (${m}): ${nf(c.pend)} ${unidadMod(a.modalidad)} sin cobrar. <b>Confeccionar EDP</b>. ${link}`});
    c.pers.filter(p => p.estado !== 'con_oc').forEach(p => {
      const d = p.desde && p.desde <= hoy ? days(p.desde, hoy) : 0;
      L.push({lv: d >= dOc ? 'red' : 'orange', ic: '📄', t: `<b>${nom}</b>: período ${p.n} (${p.tipo === 'inicial' ? 'arriendo inicial' : 'prórroga'}) adjudicado <b>sin OC/SolPed</b>${p.desde ? (p.desde > hoy ? ' (inicia el ' : ' (desde el ') + fd(p.desde) + ')' : ''}. Pedir la OC. ${link}`});
    });
    c.edps.forEach(e => {
      if (e.estado === 'borrador') L.push({lv: 'blue', ic: '✉️', t: `<b>${nom}</b>: EDP N° ${e.n} (${clp(c.monto(e))}) <b>por enviar</b> al mandante. ${link}`});
      else if (a.requiere_hes && e.hes_estado !== 'recibida' && e.hes_estado !== 'no_aplica') {
        const d = e.fecha_envio ? days(e.fecha_envio, hoy) : null;
        L.push({lv: d != null && d >= dHes ? 'red' : 'orange', ic: '🧾', t: `<b>${nom}</b>: EDP N° ${e.n} enviado${e.fecha_envio ? ' el ' + fd(e.fecha_envio) : ''}, <b>HES ${e.hes_estado === 'solicitada' ? 'solicitada, sin recibir' : 'por solicitar'}</b>. ${link}`});
      } else if (!a.requiere_hes && !e.aprobacion) L.push({lv: 'orange', ic: '✅', t: `<b>${nom}</b>: EDP N° ${e.n} enviado, falta registrar la <b>aprobación del cliente</b>. ${link}`});
      else if (!e.entregado_finanzas) L.push({lv: 'green', ic: '💼', t: `<b>${nom}</b>: EDP N° ${e.n} listo (${a.requiere_hes ? 'HES ' + esc(e.hes_numero || '') : 'aprobado'}). <b>Entregar a Finanzas</b>. ${link}`});
    });
    if ((a.estado === 'terminado') && (+a.desmovilizacion || 0) > 0 && !c.desmovCobrada)
      L.push({lv: 'red', ic: '🚚', t: `<b>${nom}</b>: servicio terminado, <b>desmovilización ${clp(a.desmovilizacion)} sin cobrar</b>. Incluirla en el EDP final. ${link}`});
  });
  const ord = {red: 0, orange: 1, amber: 2, blue: 3, green: 4};
  return L.sort((x, y) => ord[x.lv] - ord[y.lv]);
}

/* ---------------- Navegación ---------------- */
function go() {
  const h = (location.hash || '#inicio').slice(1);
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', h.startsWith(a.dataset.v) || (h.startsWith('a-') && a.dataset.v === 'arriendos')));
  const v = $('view');
  try {
    if (h.startsWith('a-')) return vArriendo(h.slice(2));
    ({inicio: vInicio, arriendos: vArriendos, flota: vFlota, catalogo: vCatalogo, mandantes: vMandantes}[h] || vInicio)();
  } catch (e) { v.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  const n = alertas().filter(x => x.lv === 'red' || x.lv === 'orange').length;
  $('ncnt').hidden = !n; $('ncnt').textContent = n;
}
window.addEventListener('hashchange', go);

/* ---------------- Vista: Inicio ---------------- */
function vInicio() {

    <div class="kpi o"><div class="l">Adjudicado sin OC</div><div class="v">${clp(vPal)}</div></div>
    <div class="kpi g"><div class="l">Enviado en EDP</div><div class="v">${clp(env)}</div></div>
    <div class="kpi"><div class="l">EDP por enviar</div><div class="v">${clp(pendEnv)}</div></div>
    <div class="kpi r"><div class="l">HES pendientes</div><div class="v">${hesP}</div></div>

  <div class="card"><div class="row"><h2 style="margin:0">Qué hacer hoy</h2><span class="sp"></span><span class="muted small">${L.length} aviso(s) · ${fd(todayISO())}</span></div>
  <div style="margin-top:10px">${L.length ? L.map(x => `<div class="al ${x.lv}"><div class="ic">${x.ic}</div><div class="tx">${x.t}</div></div>`).join('') : '<div class="msg ok">Todo al día. No hay avisos.</div>'}</div></div>`;

      ${a.modalidad === 'global' ? '' : `<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="small">${{hora: 'Horas', dia: 'Días', mes: 'Meses'}[a.modalidad]} del período: <b>${nf(c.pend, a.modalidad === 'mes' ? 1 : 0)} / ${nf(c.base)}</b></div>`}
      <div class="small muted">${a.fecha_fin ? 'Vigente hasta ' + fd(a.fecha_fin) : ''}${c.diasFin != null && ['palabra', 'con_oc'].includes(a.estado) ? ` (${c.diasFin} días)` : ''}</div>

function opts(list, val, lab, ph) { return (ph != null ? `<option value="">${esc(ph)}</option>` : '') + list.map(x => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(lab(x))}</option>`).join(''); }
function modal(html) { $('mbox').innerHTML = html; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; $('mbox').innerHTML = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
async function guardar(fn, okMsg) {
  try { await fn(); await loadAll(); closeModal(); go(); if (okMsg) toast(okMsg); }
  catch (e) { if (e.message === 'SESSION') return showLogin('Su sesión expiró.'); alert(e.message); }
}
const val = id => { const e = $(id); return e ? e.value.trim() : ''; };

function formArriendo(a) {
  const nuevo = !a; a = a || {modalidad: 'hora', base_cobro: P('base_ep_horas', 180), estado: 'palabra', requiere_hes: true, fecha_inicio: todayISO(), movilizacion: 0, desmovilizacion: 0};

  <div class="f">

    <div><label>Estado</label><select id="fEs">${[['cotizado', 'Cotizado'], ['palabra', 'Adjudicado de palabra (sin OC)'], ['con_oc', 'Con OC / SolPed'], ['terminado', 'Terminado'], ['cerrado', 'Cerrado']].map(([k, l]) => `<option value="${k}" ${a.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    ${nuevo ? `<div><label>N° OC / SolPed (si ya llegó)</label><input id="fOc"></div>` : ''}
    <div><label>¿Requiere HES?</label><select id="fHe"><option value="1" ${a.requiere_hes ? 'selected' : ''}>Sí (minera / empresa)</option><option value="0" ${!a.requiere_hes ? 'selected' : ''}>No (particular: aprobación)</option></select></div>
  </div>
  <div style="margin-top:10px"><label>Notas</label><textarea id="fNo">${esc(a.notas || '')}</textarea></div>
  <div id="fWarn" class="small" style="color:var(--orange);margin-top:6px"></div>
  <div class="mf">${!nuevo ? '<button class="dan" id="fDel">Eliminar</button><span class="sp"></span>' : ''}<button id="fCan">Cancelar</button><button class="pri" id="fOk">Guardar</button></div>`);
  const fillFromFlota = () => {
    const f = byId('flota', $('fFl').value); if (!f) return;
    const t = byId('equipo_tipos', f.tipo_id);
    if (!$('fDe').value) $('fDe').value = `${f.tipo ? f.tipo.charAt(0) + f.tipo.slice(1).toLowerCase() : ''} ${f.modelo || ''} (${f.patente || f.codigo})`.trim();
    if (t && !$('fTa').value) { if (t.tarifa) $('fTa').value = Math.round(t.tarifa); $('fMo').value = t.unidad === 'día' ? 'dia' : t.unidad === 'mes' ? 'mes' : 'hora'; }
    $('fWarn').textContent = t && !t.tarifa ? `El tipo "${t.nombre}" no tiene tarifa en el catálogo: escríbala a mano (puede guardarla luego en Catálogo).` : '';

        const m = await ins('mandantes', {nombre, requiere_hes: hes});
        D.mandantes.push(m);
        const o = document.createElement('option'); o.value = m.id; o.textContent = m.nombre;
        $('fMa').insertBefore(o, $('fMa').lastElementChild); $('fMa').value = m.id; toast('Mandante agregado');
      } catch (e) { alert(e.message); $('fMa').value = ''; return; }
    }
    const m = byId('mandantes', $('fMa').value); if (m) $('fHe').value = m.requiere_hes ? '1' : '0';
  };
  $('fCan').onclick = closeModal;
  if (!nuevo) $('fDel').onclick = () => { if (confirm('¿Eliminar este arriendo con sus horómetros, períodos y EDP?')) guardar(() => del('arriendos', a.id).then(() => { location.hash = 'arriendos'; }), 'Arriendo eliminado'); };
  $('fOk').onclick = () => {
    if (!val('fDe')) return alert('Escriba una descripción.');

      tarifa: num(val('fTa')), base_cobro: num(val('fBa')), movilizacion: num(val('fMv')) || 0, desmovilizacion: num(val('fDm')) || 0, operador: val('fOp') || null,

    guardar(async () => {
      if (nuevo) {
        const r = await ins('arriendos', o);
        const oc = val('fOc');
        if (o.estado !== 'cotizado') await ins('periodos', {arriendo_id: r.id, n: 1, tipo: 'inicial', cantidad: o.modalidad === 'global' ? 1 : o.base_cobro, tarifa: o.tarifa, desde: o.fecha_inicio, hasta: o.fecha_fin, estado: oc ? 'con_oc' : 'palabra', oc: oc || null});
        if (oc && o.estado === 'palabra') await upd('arriendos', r.id, {estado: 'con_oc'});
        location.hash = 'a-' + r.id;
      } else await upd('arriendos', a.id, o);
    }, 'Guardado');
  };
}

      <div class="kpi"><div class="l">Vendido con OC</div><div class="v">${clp(c.vendidoOC)}</div></div>
      <div class="kpi o"><div class="l">Sin OC</div><div class="v">${clp(c.vendidoPal)}</div></div></div>
      ${a.modalidad !== 'global' ? `<div class="card"><b>Avance del período actual</b><div class="bar"><i class="${pct >= 100 ? 'x' : pct >= P('umbral_horas', 0.85) * 100 ? 'w' : ''}" style="width:${pct}%"></i></div>
      <div class="small">${nf(c.pend, 1)} de ${nf(c.base)} ${unidadMod(a.modalidad)}${c.pend >= c.base ? ' · <b>corresponde EDP</b>' : ` · faltan ${nf(c.base - c.pend, 1)}`}</div>
      ${c.ultimo ? `<div class="small muted">Último reporte: ${fd(c.ultimo)} · horómetro ${nf(c.ultimoFin, 1)}</div>` : ''}</div>` : ''}`;
  } else if (tabA === 'horo') {
    if (a.modalidad !== 'hora') { T.innerHTML = `<div class="card">Este arriendo se cobra por ${unidadMod(a.modalidad)}. Los días se cuentan solos desde la fecha de inicio (${fd(a.fecha_inicio)}) hasta hoy o hasta el término.</div>`; return; }
    const last = c.hor[c.hor.length - 1];
    T.innerHTML = `<div class="card"><h2>Registrar horómetro</h2>
      <div class="f"><div><label>Fecha</label><input type="date" id="hF" value="${todayISO()}"></div>
      <div><label>N° report</label><input id="hR" value="${last && /^\d+$/.test(last.n_report || '') ? (+last.n_report + 1) : ''}"></div>
      <div><label>Horómetro inicial</label><input id="hI" inputmode="decimal" value="${last ? last.h_fin : ''}"></div>
      <div><label>Horómetro final</label><input id="hX" inputmode="decimal"></div>
      <div><label>Observación</label><input id="hO" placeholder="Lluvia, mantención, sin operación…"></div></div>
      <div class="row" style="margin-top:10px"><span id="hMsg" class="small"></span><span class="sp"></span><button class="pri" id="hOk">Guardar</button></div></div>
      <div class="card tw"><table><thead><tr><th>Fecha</th><th>N° report</th><th class="n">Inicial</th><th class="n">Final</th><th class="n">Horas</th><th>Observación</th><th></th></tr></thead><tbody>
      ${c.hor.slice().reverse().map(h => `<tr><td>${fd(h.fecha)}</td><td>${esc(h.n_report || '')}</td><td class="n">${nf(h.h_ini, 1)}</td><td class="n">${nf(h.h_fin, 1)}</td><td class="n"><b>${nf((+h.h_fin || 0) - (+h.h_ini || 0), 1)}</b></td><td class="small">${esc(h.obs || '')}</td><td><button class="sm dan" data-dh="${h.id}">✕</button></td></tr>`).join('')}
      </tbody></table></div>`;
    const chk = () => { const i = num(val('hI')), x = num(val('hX')); $('hMsg').textContent = i != null && x != null ? (x < i ? '⚠ El final es menor que el inicial.' : `${nf(x - i, 1)} h`) : (last && i != null && i !== +last.h_fin ? `⚠ El inicial no coincide con el último final (${nf(last.h_fin, 1)}).` : ''); };
    $('hI').oninput = chk; $('hX').oninput = chk;
    $('hOk').onclick = () => {
      const o = {arriendo_id: a.id, fecha: val('hF'), n_report: val('hR') || null, h_ini: num(val('hI')), h_fin: num(val('hX')), obs: val('hO') || null};
      if (!o.fecha || o.h_ini == null || o.h_fin == null) return alert('Complete fecha, horómetro inicial y final (si no trabajó, ponga el mismo valor).');
      if (o.h_fin < o.h_ini) return alert('El horómetro final no puede ser menor que el inicial.');
      if (c.hor.some(h => h.fecha === o.fecha)) return alert('Ya hay un registro para esa fecha. Bórrelo primero si quiere corregirlo.');
      guardar(() => ins('horometros', o), 'Horómetro guardado');
    };
    T.querySelectorAll('[data-dh]').forEach(b => b.onclick = () => { if (confirm('¿Borrar este registro?')) guardar(() => del('horometros', b.dataset.dh), 'Registro borrado'); });
  } else if (tabA === 'per') {
    T.innerHTML = `<div class="card tw"><table><thead><tr><th>N°</th><th>Tipo</th><th class="n">Cantidad</th><th class="n">Tarifa</th><th class="n">Monto</th><th>Desde</th><th>Hasta</th><th>Estado</th><th>OC</th><th></th></tr></thead><tbody>
      ${c.pers.map(p => `<tr><td>${p.n}</td><td>${p.tipo === 'inicial' ? 'Inicial' : 'Prórroga'}</td><td class="n">${nf(p.cantidad, 1)}</td><td class="n">${clp(p.tarifa)}</td><td class="n">${clp((+p.cantidad || 0) * (+p.tarifa || 0))}</td><td>${fd(p.desde)}</td><td>${fd(p.hasta)}</td><td>${p.estado === 'con_oc' ? '<span class="chip c-blue">Con OC</span>' : '<span class="chip c-orange">Sin OC</span>'}</td><td>${esc(p.oc || '')}</td><td><button class="sm" data-ep="${p.id}">Editar</button></td></tr>`).join('') || '<tr><td colspan="10" class="muted">Sin períodos.</td></tr>'}
      </tbody></table></div>`;
    T.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => formPeriodo(a, byId('periodos', b.dataset.ep)));
  } else if (tabA === 'edp') {
    T.innerHTML = `<div class="card tw"><table><thead><tr><th>N°</th><th>Período</th><th class="n">Cant.</th><th class="n">Monto neto</th><th>Estado</th><th>Envío</th><th>${a.requiere_hes ? 'HES' : 'Aprobación'}</th><th>Finanzas</th><th></th></tr></thead><tbody>
      ${c.edps.map(e => `<tr><td>${e.n}</td><td class="small">${fd(e.desde)} – ${fd(e.hasta)}</td><td class="n">${nf(e.cantidad, 1)}</td><td class="n">${clp(c.monto(e))}${+e.monto_mov ? '<div class="small muted">incl. mov.</div>' : ''}${+e.monto_desmov ? '<div class="small muted">incl. desmov.</div>' : ''}</td>
      <td>${({borrador: '<span class="chip">Por enviar</span>', enviado: '<span class="chip c-blue">Enviado</span>', aprobado: '<span class="chip c-green">Aprobado</span>', observado: '<span class="chip c-red">Observado</span>'})[e.estado] || esc(e.estado)}</td>
      <td>${fd(e.fecha_envio)}</td>
      <td>${a.requiere_hes ? (e.hes_estado === 'recibida' ? '<span class="chip c-green">N° ' + esc(e.hes_numero || '') + '</span>' : e.hes_estado === 'solicitada' ? '<span class="chip c-orange">Solicitada</span>' : e.hes_estado === 'no_aplica' ? '—' : '<span class="chip">Por solicitar</span>') : esc(e.aprobacion || '—')}</td>
      <td>${e.entregado_finanzas ? '✔ ' + fd(e.entregado_finanzas) : ''}</td><td><button class="sm" data-ee="${e.id}">Abrir</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">Sin EDP.</td></tr>'}
      </tbody></table></div>`;
    T.querySelectorAll('[data-ee]').forEach(b => b.onclick = () => formEdp(a, byId('edps', b.dataset.ee)));
  }
}

function formPeriodo(a, p) {
  modal(`<h3>Período ${p.n} · ${esc(a.descripcion)}</h3><div class="f">
    <div><label>Cantidad (${unidadMod(a.modalidad)})</label><input id="pC" inputmode="decimal" value="${p.cantidad ?? ''}"></div>
    <div><label>Tarifa</label><input id="pT" inputmode="numeric" value="${p.tarifa ?? ''}"></div>
    <div><label>Desde</label><input type="date" id="pD" value="${p.desde || ''}"></div>
    <div><label>Hasta</label><input type="date" id="pH" value="${p.hasta || ''}"></div>
    <div><label>Estado</label><select id="pE"><option value="palabra" ${p.estado !== 'con_oc' ? 'selected' : ''}>Adjudicado sin OC</option><option value="con_oc" ${p.estado === 'con_oc' ? 'selected' : ''}>Con OC / SolPed</option></select></div>
    <div><label>N° OC / SolPed</label><input id="pO" value="${esc(p.oc || '')}"></div></div>
    <div style="margin-top:10px"><label>Notas</label><input id="pN" value="${esc(p.notas || '')}"></div>
    <div class="mf"><button class="dan" id="pDel">Eliminar</button><span class="sp"></span><button id="pCan">Cancelar</button><button class="pri" id="pOk">Guardar</button></div>`);
  $('pCan').onclick = closeModal;
  $('pDel').onclick = () => { if (confirm('¿Eliminar este período?')) guardar(() => del('periodos', p.id), 'Período eliminado'); };
  $('pOk').onclick = () => guardar(() => upd('periodos', p.id, {cantidad: num(val('pC')), tarifa: num(val('pT')), desde: val('pD') || null, hasta: val('pH') || null, estado: val('pO') ? 'con_oc' : val('pE'), oc: val('pO') || null, notas: val('pN') || null}), 'Período guardado');
}

function formProrroga(a) {
  const c = calc(a), lastP = c.pers[c.pers.length - 1];
  const desde = a.fecha_fin ? addDays(a.fecha_fin, 1) : todayISO();
  modal(`<h3>Prorrogar · ${esc(a.descripcion)}</h3>
    <p class="small muted">Crea el período ${(lastP ? lastP.n : 0) + 1}. Queda <b>adjudicado sin OC</b> hasta que registre la OC; los horómetros siguen sumando.</p>
    <div class="f"><div><label>Cantidad (${unidadMod(a.modalidad)})</label><input id="rC" inputmode="decimal" value="${a.modalidad === 'global' ? 1 : c.base}"></div>
    <div><label>Tarifa</label><input id="rT" inputmode="numeric" value="${a.tarifa ?? ''}"></div>
    <div><label>Desde</label><input type="date" id="rD" value="${desde}"></div>
    <div><label>Hasta</label><input type="date" id="rH" value="${addDays(desde, a.modalidad === 'dia' ? c.base - 1 : 29)}"></div>
    <div><label>N° OC (si ya llegó)</label><input id="rO"></div></div>
    <div class="mf"><button id="rCan">Cancelar</button><button class="pri" id="rOk">Crear prórroga</button></div>`);
  $('rCan').onclick = closeModal;
  $('rOk').onclick = () => guardar(async () => {
    const oc = val('rO');
    await ins('periodos', {arriendo_id: a.id, n: (lastP ? lastP.n : 0) + 1, tipo: 'prorroga', cantidad: num(val('rC')), tarifa: num(val('rT')), desde: val('rD') || null, hasta: val('rH') || null, estado: oc ? 'con_oc' : 'palabra', oc: oc || null});
    await upd('arriendos', a.id, {fecha_fin: val('rH') || a.fecha_fin});
  }, 'Prórroga creada');
}

function formOC(a) {
  const pend = calc(a).pers.filter(p => p.estado !== 'con_oc');
  if (!pend.length) return alert('Todos los períodos ya tienen OC. Para cambiar un N° de OC, edítelo en la pestaña Períodos.');
  modal(`<h3>Registrar OC / SolPed</h3><div class="f">
    <div><label>Período</label><select id="oP">${pend.map(p => `<option value="${p.id}">Período ${p.n} (${p.tipo === 'inicial' ? 'inicial' : 'prórroga'}) ${fd(p.desde)}</option>`).join('')}</select></div>
    <div><label>N° OC / SolPed</label><input id="oN"></div></div>
    <div class="mf"><button id="oCan">Cancelar</button><button class="pri" id="oOk">Guardar</button></div>`);
  $('oCan').onclick = closeModal;
  $('oOk').onclick = () => { if (!val('oN')) return alert('Escriba el N° de OC.'); guardar(async () => { await upd('periodos', val('oP'), {estado: 'con_oc', oc: val('oN')}); if (a.estado === 'palabra') await upd('arriendos', a.id, {estado: 'con_oc'}); }, 'OC registrada'); };
}

function formTerminar(a) {
  const c = calc(a);
  modal(`<h3>Terminar servicio · ${esc(a.descripcion)}</h3>
    <p>Se marca como <b>terminado</b>. Luego cree el <b>EDP final</b>: incluirá lo pendiente${(+a.desmovilizacion || 0) && !c.desmovCobrada ? ` + la <b>desmovilización ${clp(a.desmovilizacion)}</b>` : ''}.</p>
    <div class="f"><div><label>Fecha de término</label><input type="date" id="tF" value="${todayISO()}"></div></div>
    <div class="mf"><button id="tCan">Cancelar</button><button class="pri" id="tOk">Terminar y crear EDP final</button></div>`);
  $('tCan').onclick = closeModal;
  $('tOk').onclick = async () => {
    try { await upd('arriendos', a.id, {estado: 'terminado', fecha_fin: val('tF')}); await loadAll(); formEdp(byId('arriendos', a.id), null, true); }
    catch (e) { alert(e.message); }
  };
}

function formEdp(a, e, final) {
  const c = calc(a), nuevo = !e;
  if (nuevo) {
    const last = c.edps[c.edps.length - 1];
    const desde = last && last.hasta ? addDays(last.hasta, 1) : a.fecha_inicio;
    const cant = a.modalidad === 'global' ? 1 : final ? Math.max(0, Math.round(c.pend * 10) / 10) : (c.pend >= c.base ? c.base : Math.max(0, Math.round(c.pend * 10) / 10));
    const per = c.pers.filter(p => p.estado === 'con_oc').pop() || c.pers[c.pers.length - 1];
    e = {n: (last ? last.n : 0) + 1, desde, hasta: final ? a.fecha_fin : todayISO(), cantidad: cant, tarifa: a.tarifa, monto_mov: c.movCobrada ? 0 : (+a.movilizacion || 0),
      monto_desmov: final && !c.desmovCobrada ? (+a.desmovilizacion || 0) : 0, monto_otros: 0, estado: 'borrador', oc: per ? per.oc : '', periodo_id: per ? per.id : null,
      hes_estado: a.requiere_hes ? 'por_solicitar' : 'no_aplica'};
  }
  modal(`<h3>${nuevo ? (final ? 'EDP final' : 'Nuevo EDP') : 'EDP N° ' + e.n} · ${esc(a.descripcion)}</h3>
    <div class="f">
      <div><label>N° EDP</label><input id="eN" inputmode="numeric" value="${e.n}"></div>
      <div><label>Desde</label><input type="date" id="eD" value="${e.desde || ''}"></div>
      <div><label>Hasta (corte)</label><input type="date" id="eH" value="${e.hasta || ''}"></div>
      <div><label>Cantidad (${unidadMod(a.modalidad)})</label><input id="eC" inputmode="decimal" value="${e.cantidad ?? ''}"></div>
      <div><label>Tarifa</label><input id="eT" inputmode="numeric" value="${e.tarifa ?? ''}"></div>
      <div><label>Movilización $</label><input id="eMv" inputmode="numeric" value="${e.monto_mov ?? 0}"></div>
      <div><label>Desmovilización $</label><input id="eDm" inputmode="numeric" value="${e.monto_desmov ?? 0}"></div>
      <div><label>Otros $</label><input id="eOt" inputmode="numeric" value="${e.monto_otros ?? 0}"></div>
      <div><label>N° OC</label><input id="eOc" value="${esc(e.oc || '')}"></div>
      <div><label>Estado</label><select id="eE">${[['borrador', 'Por enviar'], ['enviado', 'Enviado'], ['aprobado', 'Aprobado'], ['observado', 'Observado']].map(([k, l]) => `<option value="${k}" ${e.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label>Fecha de envío</label><input type="date" id="eF" value="${e.fecha_envio || ''}"></div>
      ${a.requiere_hes ? `<div><label>Estado HES</label><select id="eHs">${[['por_solicitar', 'Por solicitar'], ['solicitada', 'Solicitada'], ['recibida', 'Recibida'], ['no_aplica', 'No aplica']].map(([k, l]) => `<option value="${k}" ${e.hes_estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label>N° HES</label><input id="eHn" value="${esc(e.hes_numero || '')}"></div>
      <div><label>Fecha HES</label><input type="date" id="eHf" value="${e.hes_fecha || ''}"></div>` :
      `<div><label>Aprobación del cliente</label><input id="eAp" value="${esc(e.aprobacion || '')}" placeholder="Ej. correo 12-11 de J. Pérez"></div>`}
      <div><label>Entregado a Finanzas</label><input type="date" id="eFi" value="${e.entregado_finanzas || ''}"></div>
    </div>
    <div class="big" style="margin-top:12px" id="eTot"></div>
    <div style="margin-top:8px"><label>Notas</label><input id="eNo" value="${esc(e.notas || '')}"></div>
    <div class="mf">${!nuevo ? '<button class="dan" id="eDel">Eliminar</button><span class="sp"></span>' : ''}<button id="eCan">Cancelar</button><button class="pri" id="eOk">Guardar</button></div>`);
  const tot = () => { const ma = (num(val('eC')) || 0) * (num(val('eT')) || 0); const t = ma + (num(val('eMv')) || 0) + (num(val('eDm')) || 0) + (num(val('eOt')) || 0); $('eTot').textContent = `Neto ${clp(t)} · IVA ${clp(t * P('iva', 0.19))} · Total ${clp(t * (1 + P('iva', 0.19)))}`; };
  ['eC', 'eT', 'eMv', 'eDm', 'eOt'].forEach(i => $(i).oninput = tot); tot();
  if ($('eHn')) $('eHn').oninput = () => { if (val('eHn')) { $('eHs').value = 'recibida'; if (!val('eHf')) $('eHf').value = todayISO(); } };
  $('eF').onchange = () => { if (val('eF') && val('eE') === 'borrador') $('eE').value = 'enviado'; };
  $('eCan').onclick = () => { closeModal(); go(); };
  if (!nuevo) $('eDel').onclick = () => { if (confirm('¿Eliminar este EDP?')) guardar(() => del('edps', e.id), 'EDP eliminado'); };
  $('eOk').onclick = () => {
    const o = {arriendo_id: a.id, periodo_id: e.periodo_id || null, n: num(val('eN')), desde: val('eD') || null, hasta: val('eH') || null, cantidad: num(val('eC')), tarifa: num(val('eT')),
      monto_arriendo: (num(val('eC')) || 0) * (num(val('eT')) || 0), monto_mov: num(val('eMv')) || 0, monto_desmov: num(val('eDm')) || 0, monto_otros: num(val('eOt')) || 0,
      oc: val('eOc') || null, estado: val('eE'), fecha_envio: val('eF') || null, entregado_finanzas: val('eFi') || null, notas: val('eNo') || null};
    if (a.requiere_hes) Object.assign(o, {hes_estado: val('eHn') ? 'recibida' : val('eHs'), hes_numero: val('eHn') || null, hes_fecha: val('eHf') || null});
    else Object.assign(o, {hes_estado: 'no_aplica', aprobacion: val('eAp') || null});
    if (o.estado !== 'borrador' && !o.oc && !confirm('Este EDP no tiene N° de OC. ¿Guardar igual?')) return;
    if (nuevo && c.edps.some(x => x.n === o.n)) return alert('Ya existe un EDP con ese número.');
    guardar(() => nuevo ? ins('edps', o) : upd('edps', e.id, o), 'EDP guardado');
  };
}

/* ---------------- Vista: Flota ---------------- */
let qFl = '';
function vFlota() {

  const enArr = id => D.arriendos.find(a => a.flota_id === id && ['palabra', 'con_oc'].includes(a.estado));

  <div class="card tw"><table><thead><tr><th>Código</th><th>Patente</th><th>Tipo</th><th>Modelo</th><th class="hide-m">Tarifa catálogo</th><th>Situación</th></tr></thead><tbody>
  ${L.map(f => { const t = byId('equipo_tipos', f.tipo_id), a = enArr(f.id); return `<tr class="click" data-f="${f.id}" style="${f.activo ? '' : 'opacity:.5'}"><td><b>${esc(f.codigo)}</b></td><td>${esc(f.patente || '')}</td><td>${esc(f.tipo || '')}</td><td>${esc(f.modelo || '')}</td>
  <td class="hide-m">${t ? (t.tarifa ? clp(t.tarifa) + ' / ' + esc(t.unidad) : '<span class="chip c-amber">Pendiente de precio</span>') : '—'}</td>
  <td>${!f.activo ? '<span class="chip">De baja</span>' : a ? '<span class="chip c-blue">Arrendado · ' + esc(mandante(a).nombre || '') + '</span>' : ''}${f.propio ? '' : ' <span class="chip c-orange">Terceros</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  $('qF').oninput = e => { qFl = e.target.value; const p = e.target.selectionStart; vFlota(); $('qF').focus(); $('qF').setSelectionRange(p, p); };

    <div><label>Tarifa del catálogo</label><select id="qTi">${opts(D.equipo_tipos.slice().sort((x, y) => x.nombre.localeCompare(y.nombre)), f.tipo_id, t => `${t.nombre} · ${t.tarifa ? clp(t.tarifa) + '/' + t.unidad : 'sin precio'}`, '— Ninguna / crear en Catálogo —')}</select></div>
    <div><label>Propiedad</label><select id="qPr"><option value="1" ${f.propio ? 'selected' : ''}>Propio</option><option value="0" ${!f.propio ? 'selected' : ''}>De terceros (subarriendo)</option></select></div>
    <div><label>Situación</label><select id="qAc"><option value="1" ${f.activo ? 'selected' : ''}>Activo</option><option value="0" ${!f.activo ? 'selected' : ''}>Dado de baja / vendido</option></select></div></div>
    <div style="margin-top:10px"><label>Notas</label><input id="qN" value="${esc(f.notas || '')}"></div>
    <div class="mf"><button id="qCan">Cancelar</button><button class="pri" id="qOk">Guardar</button></div>`);
  $('qCan').onclick = closeModal;
  $('qOk').onclick = () => {
    if (!val('qC')) return alert('Escriba el código interno.');
    const o = {codigo: val('qC'), patente: val('qP') || null, tipo: val('qT').toUpperCase() || null, modelo: val('qM') || null, anio: num(val('qA')), tipo_id: val('qTi') || null, propio: val('qPr') === '1', activo: val('qAc') === '1', notas: val('qN') || null};
    guardar(() => nuevo ? ins('flota', o) : upd('flota', f.id, o), 'Equipo guardado');
  };
}

/* ---------------- Vista: Catálogo ---------------- */
let tabC = 'equipo_tipos';
const CAT = {
  equipo_tipos: {t: 'Equipos', cols: [['nombre', 'Nombre', 't'], ['unidad', 'Unidad', 't'], ['tarifa', 'Tarifa $', 'n'], ['consumo_lh', 'Diésel l/h', 'n'], ['balde_m3', 'Balde m³', 'n'], ['notas', 'Notas', 't']]},
  personal: {t: 'Personal', cols: [['cargo', 'Cargo', 't'], ['sueldo', 'Sueldo líquido $', 'n'], ['valor_hh', 'Valor HH $', 'n'], ['notas', 'Notas', 't']]},
  materiales: {t: 'Materiales e insumos', cols: [['nombre', 'Nombre', 't'], ['unidad', 'Unidad', 't'], ['precio', 'Precio $', 'n'], ['notas', 'Notas', 't']]},
  parametros: {t: 'Parámetros', cols: [['clave', 'Clave', 'r'], ['descripcion', 'Descripción', 'r'], ['valor', 'Valor', 'n']]}
};
function vCatalogo() {
  const C = CAT[tabC];
  const rows = D[tabC].slice().sort((x, y) => String(x[C.cols[0][0]]).localeCompare(String(y[C.cols[0][0]])));
  $('view').innerHTML = `<div class="tabs">${Object.entries(CAT).map(([k, v]) => `<button data-c="${k}" class="${tabC === k ? 'on' : ''}">${v.t}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:8px"><span class="muted small">Escriba directo en la celda: se guarda al salir de ella.${tabC === 'equipo_tipos' ? ' Tarifa vacía = pendiente de precio.' : ''}${tabC === 'personal' ? ' Valor HH = sueldo × (1 + leyes) ÷ horas/mes, si lo deja vacío se calcula.' : ''}</span><span class="sp"></span>${tabC !== 'parametros' ? '<button class="pri sm" id="cAdd">+ Agregar</button>' : ''}</div>
  <div class="card tw"><table><thead><tr>${C.cols.map(c => `<th class="${c[2] === 'n' ? 'n' : ''}">${c[1]}</th>`).join('')}${tabC === 'equipo_tipos' ? '<th>Actualizado</th>' : ''}${tabC !== 'parametros' ? '<th></th>' : ''}</tr></thead><tbody>
  ${rows.map(r => `<tr>${C.cols.map(c => c[2] === 'r' ? `<td class="small">${esc(r[c[0]])}</td>` : `<td class="${c[2] === 'n' ? 'n' : ''}"><input data-id="${r.id || r.clave}" data-k="${c[0]}" data-n="${c[2] === 'n' ? 1 : 0}" value="${esc(r[c[0]] ?? '')}" ${c[2] === 'n' ? 'inputmode="decimal" style="text-align:right;min-width:90px"' : 'style="min-width:120px"'}></td>`).join('')}
  ${tabC === 'equipo_tipos' ? `<td class="small">${r.tarifa == null ? '<span class="chip c-amber">Sin precio</span>' : fd(r.tarifa_fecha) || ''}</td>` : ''}${tabC !== 'parametros' ? `<td><button class="sm dan" data-del="${r.id}">✕</button></td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { tabC = b.dataset.c; vCatalogo(); });
  document.querySelectorAll('td input[data-k]').forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.k, v = inp.dataset.n === '1' ? num(inp.value) : (inp.value.trim() || null), o = {[k]: v};
    try {
      if (tabC === 'parametros') { await api(`parametros?clave=eq.${encodeURIComponent(inp.dataset.id)}`, {method: 'PATCH', body: JSON.stringify({valor: v, actualizado: new Date().toISOString()})}); }
      else {
        if (tabC === 'equipo_tipos' && k === 'tarifa') o.tarifa_fecha = todayISO();
        if (tabC === 'personal' && k === 'sueldo' && v) { const r = byId('personal', inp.dataset.id); if (r && !r.valor_hh_manual) o.valor_hh = Math.round(v * (1 + P('leyes', 0.42)) / P('horas_mes', 180)); }
        await upd(tabC, inp.dataset.id, o);
      }
      await loadAll(); toast('Guardado'); if (tabC !== 'parametros' && (k === 'tarifa' || k === 'sueldo')) vCatalogo();
    } catch (e) { if (e.message === 'SESSION') return showLogin('Su sesión expiró.'); alert(e.message); }
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('¿Eliminar este ítem del catálogo?')) guardar(() => del(tabC, b.dataset.del), 'Eliminado'); });
  if ($('cAdd')) $('cAdd').onclick = () => {
    const first = CAT[tabC].cols[0][0], name = prompt('Nombre del nuevo ítem:'); if (!name) return;
    guardar(() => ins(tabC, {[first]: name.trim()}), 'Agregado');
  };
}

/* ---------------- Vista: Mandantes ---------------- */
function vMandantes() {
  $('view').innerHTML = `<div class="row" style="margin-bottom:12px"><span class="sp"></span><button class="pri" id="nM">+ Agregar mandante</button></div>
  <div class="card tw"><table><thead><tr><th>Mandante</th><th>¿Emite HES?</th><th>Contacto</th><th>Notas</th></tr></thead><tbody>
  ${D.mandantes.slice().sort((x, y) => x.nombre.localeCompare(y.nombre)).map(m => `<tr class="click" data-m="${m.id}"><td><b>${esc(m.nombre)}</b></td><td>${m.requiere_hes ? 'Sí' : 'No (particular)'}</td><td>${esc(m.contacto || '')}</td><td class="small">${esc(m.notas || '')}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('nM').onclick = () => formMandante();
  document.querySelectorAll('[data-m]').forEach(r => r.onclick = () => formMandante(byId('mandantes', r.dataset.m)));
}
function formMandante(m) {
  const nuevo = !m; m = m || {requiere_hes: true};
  modal(`<h3>${nuevo ? 'Nuevo mandante' : esc(m.nombre)}</h3><div class="f">
    <div><label>Nombre</label><input id="mN" value="${esc(m.nombre || '')}"></div>
    <div><label>¿Emite HES?</label><select id="mH"><option value="1" ${m.requiere_hes ? 'selected' : ''}>Sí (minera / empresa)</option><option value="0" ${!m.requiere_hes ? 'selected' : ''}>No (particular)</option></select></div>
    <div><label>Contacto</label><input id="mC" value="${esc(m.contacto || '')}"></div></div>
    <div style="margin-top:10px"><label>Notas</label><input id="mO" value="${esc(m.notas || '')}"></div>
    <div class="mf"><button id="mCan">Cancelar</button><button class="pri" id="mOk">Guardar</button></div>`);
  $('mCan').onclick = closeModal;
  $('mOk').onclick = () => { if (!val('mN')) return alert('Escriba el nombre.'); const o = {nombre: val('mN'), requiere_hes: val('mH') === '1', contacto: val('mC') || null, notas: val('mO') || null}; guardar(() => nuevo ? ins('mandantes', o) : upd('mandantes', m.id, o), 'Mandante guardado'); };
}

/* ---------------- Inicio de sesión ---------------- */
function showLogin(msg) { $('login').hidden = false; $('nav').hidden = true; $('logout').hidden = true; $('view').innerHTML = ''; $('lErr').textContent = msg || ''; }
async function start() {
  if (!await ensureSession()) return showLogin();
  $('login').hidden = true; $('msg').innerHTML = '<div class="msg info">Cargando…</div>';
  try {
    let admin = false;
    try { admin = !!(await api('rpc/es_admin', {method: 'POST', body: '{}'})); } catch (e) { if (e.message === 'SESSION') throw e; }
    $('who').textContent = SESSION.email;
    $('logout').hidden = false;
    if (!admin) { $('msg').innerHTML = '<div class="msg info">Esta sección es solo para el administrador. <a href="index.html">Ir al panel gerencial</a></div>'; return; }
    await loadAll();
    if (!D.parametros.length) { $('msg').innerHTML = '<div class="msg err">Faltan las tablas en Supabase. Ejecute los scripts sql/01_estructura.sql y sql/02_datos.sql.</div>'; return; }
    $('msg').innerHTML = ''; $('nav').hidden = false; go();
  } catch (e) {
    if (e.message === 'SESSION') return showLogin('Su sesión expiró. Ingrese nuevamente.');
    $('msg').innerHTML = `<div class="msg err">${esc(e.message)}${/relation|does not exist|schema cache/i.test(e.message) ? '<br>Ejecute primero los scripts SQL en Supabase.' : ''}</div>`;
  }
}
$('login').addEventListener('submit', async e => {
  e.preventDefault(); $('lErr').textContent = ''; $('lBtn').disabled = true;
  try { SESSION = await authReq({email: val('lEmail'), password: $('lPass').value}, 'password'); saveSession(); $('lPass').value = ''; await start(); }
  catch (err) { $('lErr').textContent = err.message; } finally { $('lBtn').disabled = false; }
});
$('logout').onclick = async () => { try { await fetch(`${SUPABASE_URL}/auth/v1/logout`, {method: 'POST', headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SESSION.access_token}}); } catch (e) {} SESSION = null; saveSession(); location.reload(); };
start();
})();
</script>
